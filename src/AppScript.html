  /* -------------------- Adaptador de Transporte (GAS vs Demo Local) -------------------- */

  function callServer(methodName, payload) {
    if (window.agendaPages) return window.agendaPages.call(methodName, payload);
    return new Promise(function (resolve, reject) {
      if (window.google && window.google.script && window.google.script.run) {
        var runner = window.google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(function (err) {
            reject(new Error((err && err.message) || String(err || 'Erro de comunicação com o servidor.')));
          });
        if (payload !== undefined) {
          runner[methodName](payload);
        } else {
          runner[methodName]();
        }
        return;
      }
      reject(new Error('Ambiente Google Apps Script não detectado.'));
    });
  }

  /* -------------------- Utilitários de Texto e Datas -------------------- */

  function normalizeText(value) {
    if (value === null || value === undefined) return '';
    return String(value)
      .trim()
      .toLowerCase()
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '');
  }

  function normalizeDigits(value) {
    return String(value || '').replace(/\D+/g, '');
  }

  function normalizeAlphanumeric(value) {
    return normalizeText(value).replace(/[^a-z0-9]+/g, '');
  }

  function escapeHtml(str) {
    return String(str === null || str === undefined ? '' : str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function isCompleteRecord(rec) {
    if (!rec) return false;
    var proc = String(rec.numeroProcesso || '').trim();
    var cli = String(rec.cliente || '').trim();
    return Boolean(proc && cli);
  }

  function recordKey(rec) {
    return rec.id || rec.tempRowKey;
  }

  // Vazio conta como "Não": a tabela já exibe assim e o prazo vencido sem protocolo precisa de conferência.
  function isProtocoladoNao(val) {
    var v = normalizeText(val);
    return v === 'nao' || v === '';
  }

  function isProtocoladoSim(val) {
    return normalizeText(val) === 'sim';
  }

  function classifyForDate(record, refIso) {
    var fatalIso = record.dataFatal && record.dataFatal.iso ? record.dataFatal.iso : null;
    var juntadaIso = record.dataJuntada && record.dataJuntada.iso ? record.dataJuntada.iso : null;
    var isFatalOnDate = Boolean(fatalIso && fatalIso === refIso);
    var isJuntadaOnDate = Boolean(juntadaIso && juntadaIso === refIso);
    var isPendingReview = Boolean(fatalIso && fatalIso < refIso && isProtocoladoNao(record.protocolado));

    return {
      inAttentionView: isFatalOnDate || isJuntadaOnDate || isPendingReview,
      isFatalOnDate: isFatalOnDate,
      isJuntadaOnDate: isJuntadaOnDate,
      isPendingReview: isPendingReview
    };
  }

  function matchesSearch(record, query) {
    if (!query || !query.trim()) return true;
    var qText = normalizeText(query);
    var qDigits = normalizeDigits(query);
    var qAlnum = normalizeAlphanumeric(query);

    if (qText && normalizeText(record.cliente).indexOf(qText) !== -1) return true;
    if (qText && normalizeText(record.numeroProcesso).indexOf(qText) !== -1) return true;
    if (qAlnum && normalizeAlphanumeric(record.numeroProcesso).indexOf(qAlnum) !== -1) return true;

    var hasLetters = /[a-z]/i.test(qText);
    if (!hasLetters && qDigits) {
      var procDigits = normalizeDigits(record.numeroProcesso);
      if (procDigits && procDigits.indexOf(qDigits) !== -1) return true;
    }
    return false;
  }

  function matchesFilters(record) {
    if (!matchesSearch(record, state.filters.search)) return false;
    if (state.filters.responsavel && normalizeText(record.responsavel) !== normalizeText(state.filters.responsavel)) return false;
    if (state.filters.tribunal && normalizeText(record.tribunal) !== normalizeText(state.filters.tribunal)) return false;
    if (state.filters.priorizacao && normalizeText(record.priorizacao) !== normalizeText(state.filters.priorizacao)) return false;
    if (state.filters.tipo && normalizeText(record.tipo) !== normalizeText(state.filters.tipo)) return false;
    if (state.filters.protocolado) {
      var wantsNao = isProtocoladoNao(state.filters.protocolado);
      if (wantsNao ? !isProtocoladoNao(record.protocolado) : normalizeText(record.protocolado) !== normalizeText(state.filters.protocolado)) return false;
    }
    return true;
  }

  function shiftIsoDate(iso, deltaDays) {
    var parts = iso.split('-').map(Number);
    var dt = new Date(Date.UTC(parts[0], parts[1] - 1, parts[2], 12, 0, 0));
    dt.setUTCDate(dt.getUTCDate() + deltaDays);
    var y = dt.getUTCFullYear();
    var m = String(dt.getUTCMonth() + 1).padStart(2, '0');
    var d = String(dt.getUTCDate()).padStart(2, '0');
    return y + '-' + m + '-' + d;
  }

  function formatDateHeaderPtBr(iso) {
    if (!iso) return '--/--/----';
    var parts = iso.split('-').map(Number);
    var dt = new Date(Date.UTC(parts[0], parts[1] - 1, parts[2], 12, 0, 0));
    var weekdays = ['domingo', 'segunda-feira', 'terça-feira', 'quarta-feira', 'quinta-feira', 'sexta-feira', 'sábado'];
    var br = String(parts[2]).padStart(2, '0') + '/' + String(parts[1]).padStart(2, '0') + '/' + parts[0];
    var suffix = iso === state.meta.todayIso ? ' • Hoje' : '';
    return br + ' (' + weekdays[dt.getUTCDay()] + ')' + suffix;
  }

  function priorityClass(prio) {
    var n = normalizeText(prio);
    if (n === 'urgente') return 'prio-urgente';
    if (n === 'alta') return 'prio-alta';
    if (n === 'media') return 'prio-media';
    if (n === 'baixa') return 'prio-baixa';
    if (n === 'sem urgencia') return 'prio-sem-urgencia';
    return 'badge-neutral';
  }

  function sortRecords(list, refIso) {
    return list.slice().sort(function (a, b) {
      var ca = classifyForDate(a, refIso);
      var cb = classifyForDate(b, refIso);

      // 1) Em atenção: Pendente de conferência -> Fatal no dia -> Juntada no dia -> Outros
      var wa = ca.isPendingReview ? 1 : (ca.isFatalOnDate ? 2 : (ca.isJuntadaOnDate ? 3 : 4));
      var wb = cb.isPendingReview ? 1 : (cb.isFatalOnDate ? 2 : (cb.isJuntadaOnDate ? 3 : 4));
      if (wa !== wb) return wa - wb;

      // 2) Data fatal mais próxima primeiro (vazias por último)
      var fa = (a.dataFatal && a.dataFatal.iso) || '9999-12-31';
      var fb = (b.dataFatal && b.dataFatal.iso) || '9999-12-31';
      if (fa !== fb) return fa < fb ? -1 : 1;

      // 3) Prioridade
      var pa = PRIORITY_RANK[normalizeText(a.priorizacao)] || 99;
      var pb = PRIORITY_RANK[normalizeText(b.priorizacao)] || 99;
      if (pa !== pb) return pa - pb;

      return (a.numeroProcesso || '').localeCompare(b.numeroProcesso || '');
    });
  }

  /* -------------------- Feedback Visual -------------------- */

  function showToast(message, type, durationMs) {
    var kind = type || 'info';
    var isRoutine = kind === 'success' || kind === 'info';

    // Evita empilhar várias notificações cobrindo a tabela ao alterar vários registros seguidos
    if (isRoutine) {
      var prevRoutine = els.toastContainer.querySelectorAll('.toast.success, .toast.info');
      for (var i = 0; i < prevRoutine.length; i++) {
        if (prevRoutine[i].parentNode) prevRoutine[i].parentNode.removeChild(prevRoutine[i]);
      }
    }

    var div = document.createElement('div');
    div.className = 'toast ' + kind;
    div.textContent = message;
    div.title = 'Clique para fechar';
    div.addEventListener('click', function () {
      if (div.parentNode) div.parentNode.removeChild(div);
    });
    els.toastContainer.appendChild(div);

    var ms = durationMs || (isRoutine ? 1800 : 3600);
    setTimeout(function () {
      div.classList.add('is-leaving');
      setTimeout(function () {
        if (div.parentNode) div.parentNode.removeChild(div);
      }, 220);
    }, ms);
  }

  function showGlobalAlert(message, type) {
    if (!message) {
      els.globalAlert.className = 'alert hidden';
      els.globalAlert.textContent = '';
      return;
    }
    els.globalAlert.className = 'alert alert-' + (type || 'info');
    els.globalAlert.textContent = message;
  }

  /* -------------------- População de Opções Dinâmicas -------------------- */

  function populateSelect(selectEl, options, allLabel, currentValue) {
    var html = '';
    if (allLabel !== null) {
      html += '<option value="">' + escapeHtml(allLabel) + '</option>';
    }
    for (var i = 0; i < options.length; i++) {
      var opt = options[i];
      html += '<option value="' + escapeHtml(opt) + '">' + escapeHtml(opt) + '</option>';
    }
    selectEl.innerHTML = html;
    if (currentValue !== undefined) {
      selectEl.value = currentValue;
    }
  }

  function populateDatalist(listEl, values) {
    if (!listEl) return;
    var seen = {};
    var unique = [];
    for (var i = 0; i < values.length; i++) {
      var v = String(values[i] || '').trim();
      var k = normalizeText(v);
      if (v && !seen[k]) {
        seen[k] = true;
        unique.push(v);
      }
    }
    unique.sort(function (a, b) { return a.localeCompare(b, 'pt-BR', { sensitivity: 'base' }); });
    listEl.innerHTML = unique.map(function (v) {
      return '<option value="' + escapeHtml(v) + '"></option>';
    }).join('');
  }

  function populateAllFilterSelects() {
    var recordTribunais = state.records.map(function (r) { return r.tribunal; });
    var recordTipos = state.records.map(function (r) { return r.tipo; });
    var allTribunais = (state.options.tribunal || []).concat(recordTribunais);
    var allTipos = (state.options.tipo || []).concat(recordTipos);

    populateSelect(els.filterResponsavel, state.options.responsavel || [], 'Todos', state.filters.responsavel);
    populateSelect(els.filterTribunal, state.options.tribunal || [], 'Todos', state.filters.tribunal);
    populateSelect(els.filterPriorizacao, state.options.priorizacao || [], 'Todas', state.filters.priorizacao);

    populateDatalist(els.tribunalSuggestions, allTribunais);
    populateDatalist(els.tipoSuggestions, allTipos);
  }

  function renderAttentionBadgesHtml(cls, rec) {
    var parts = [];
    if (rec && !isCompleteRecord(rec)) {
      parts.push('<span class="badge badge-fatal" title="Falta o número do processo ou o cliente na planilha">Cadastro incompleto</span>');
    }
    if (cls.isPendingReview) {
      parts.push('<span class="badge badge-pending" title="Data fatal anterior à data consultada com Protocolado = Não ou em branco">Pendente de conferência</span>');
    }
    if (cls.isFatalOnDate) {
      parts.push('<span class="badge badge-fatal">Fatal no dia</span>');
    }
    if (cls.isJuntadaOnDate) {
      parts.push('<span class="badge badge-juntada">Juntada no dia</span>');
    }
    if (parts.length === 0) {
      parts.push('<span class="badge badge-neutral">Agenda geral</span>');
    }
    return '<div class="badge-stack">' + parts.join('') + '</div>';
  }

  function prefersReducedMotion() {
    return typeof window.matchMedia === 'function' && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }

  function animateNumber(el, target, fromVal, suffix, durationMs) {
    if (!el) return;
    var sfx = suffix || '';
    var to = Number(target) || 0;
    var from = Number(fromVal) || 0;
    if (prefersReducedMotion() || from === to) {
      el.textContent = String(to) + sfx;
      return;
    }
    var ms = durationMs || 620;
    var t0 = performance.now();
    function tick(now) {
      var p = Math.max(0, Math.min(1, (now - t0) / ms));
      var eased = 1 - Math.pow(1 - p, 3);
      var cur = p >= 1 ? to : Math.round(from + (to - from) * eased);
      el.textContent = String(cur) + sfx;
      if (p < 1 && el.isConnected) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }

  function rowPriorityClass(prio) {
    var n = normalizeText(prio);
    if (n === 'urgente') return 'row-prio-urgente';
    if (n === 'alta') return 'row-prio-alta';
    if (n === 'media') return 'row-prio-media';
    if (n === 'baixa') return 'row-prio-baixa';
    if (n === 'sem urgencia') return 'row-prio-sem-urgencia';
    return '';
  }

  function buildSmoothBezierPath(points) {
    if (!points || points.length === 0) return '';
    if (points.length < 3) {
      return points.map(function (p, i) { return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join('');
    }
    var d = 'M' + points[0][0].toFixed(1) + ' ' + points[0][1].toFixed(1);
    for (var i = 0; i < points.length - 1; i++) {
      var p0 = points[i - 1] || points[i];
      var p1 = points[i];
      var p2 = points[i + 1];
      var p3 = points[i + 2] || p2;
      var c1x = p1[0] + (p2[0] - p0[0]) / 6;
      var c1y = p1[1] + (p2[1] - p0[1]) / 6;
      var c2x = p2[0] - (p3[0] - p1[0]) / 6;
      var c2y = p2[1] - (p3[1] - p1[1]) / 6;
      d += 'C' + c1x.toFixed(1) + ' ' + c1y.toFixed(1) + ' ' + c2x.toFixed(1) + ' ' + c2y.toFixed(1) + ' ' + p2[0].toFixed(1) + ' ' + p2[1].toFixed(1);
    }
    return d;
  }

  function renderAgenda() {
    var refIso = state.referenceDateIso || state.meta.todayIso;
    els.referenceDateDisplay.textContent = formatDateHeaderPtBr(refIso);
    els.referenceDateInput.value = refIso;

    var attentionAll = [];
    var pendingCount = 0;
    var fatalCount = 0;
    var juntadaCount = 0;

    for (var i = 0; i < state.records.length; i++) {
      var rec = state.records[i];
      var cls = classifyForDate(rec, refIso);
      if (cls.isPendingReview) pendingCount++;
      if (cls.isFatalOnDate) fatalCount++;
      if (cls.isJuntadaOnDate) juntadaCount++;
      if (cls.inAttentionView) attentionAll.push(rec);
    }

    var shouldAnimateNumbers = !state.hasAnimatedInitial || state.animateChartsNext;
    var fromPending = !state.hasAnimatedInitial ? 0 : state.prevKpis.pending;
    var fromFatal = !state.hasAnimatedInitial ? 0 : state.prevKpis.fatal;
    var fromJuntada = !state.hasAnimatedInitial ? 0 : state.prevKpis.juntada;

    if (shouldAnimateNumbers) {
      animateNumber(els.kpiPending, pendingCount, fromPending, '', 680);
      animateNumber(els.kpiFatal, fatalCount, fromFatal, '', 680);
      animateNumber(els.kpiJuntada, juntadaCount, fromJuntada, '', 680);
    } else {
      els.kpiPending.textContent = String(pendingCount);
      els.kpiFatal.textContent = String(fatalCount);
      els.kpiJuntada.textContent = String(juntadaCount);
    }
    state.prevKpis.pending = pendingCount;
    state.prevKpis.fatal = fatalCount;
    state.prevKpis.juntada = juntadaCount;

    els.countTabAttention.textContent = String(attentionAll.length);
    els.countTabAll.textContent = String(state.records.length);
    if (els.navCountAttention) els.navCountAttention.textContent = String(attentionAll.length);
    if (els.navCountAll) els.navCountAll.textContent = String(state.records.length);

    els.tabAttention.classList.toggle('active', state.scope === 'attention');
    els.tabAttention.setAttribute('aria-selected', String(state.scope === 'attention'));
    els.tabAll.classList.toggle('active', state.scope === 'all');
    els.tabAll.setAttribute('aria-selected', String(state.scope === 'all'));

    if (els.navDashboard) {
      els.navDashboard.classList.toggle('active', state.showAnalytics);
      els.navAttention.classList.toggle('active', !state.showAnalytics && state.scope === 'attention');
      els.navAll.classList.toggle('active', !state.showAnalytics && state.scope === 'all');
    }
    if (els.analyticsSection) {
      els.analyticsSection.classList.toggle('hidden', !state.showAnalytics);
    }
    if (els.btnToggleAnalytics) {
      els.btnToggleAnalytics.textContent = state.showAnalytics ? 'Ocultar gráficos' : 'Mostrar gráficos';
    }

    var baseList = state.scope === 'attention' ? attentionAll : state.records;
    var visible = sortRecords(baseList.filter(matchesFilters), refIso);

    var fromVisible = !state.hasAnimatedInitial ? 0 : state.prevKpis.visible;
    if (shouldAnimateNumbers) {
      animateNumber(els.kpiVisible, visible.length, fromVisible, '', 680);
    } else {
      els.kpiVisible.textContent = String(visible.length);
    }
    state.prevKpis.visible = visible.length;

    renderAnalytics(refIso, shouldAnimateNumbers);
    state.animateChartsNext = false;

    els.kpiVisibleSub.textContent = state.scope === 'attention'
      ? 'Na visão de atenção do dia (com seus filtros)'
      : 'Em toda a agenda (com seus filtros)';

    // Avisa se há correspondências extras fora da visão diária quando o usuário pesquisa/filtra
    var hasActiveFilter = Boolean(
      state.filters.search.trim() ||
      state.filters.responsavel ||
      state.filters.tribunal ||
      state.filters.priorizacao ||
      state.filters.tipo ||
      state.filters.protocolado
    );

    if (state.scope === 'attention' && hasActiveFilter) {
      var totalAllMatches = state.records.filter(matchesFilters).length;
      var extraCount = totalAllMatches - visible.length;
      if (extraCount > 0) {
        els.extraMatchesHint.classList.remove('hidden');
        els.extraMatchesHint.innerHTML =
          'Há <strong>' + extraCount + '</strong> outro(s) registro(s) fora da visão deste dia. ' +
          '<button type="button" class="btn-link" id="btnSwitchToAllHint">Ver em Toda a agenda</button>';
        var switchBtn = document.getElementById('btnSwitchToAllHint');
        if (switchBtn) {
          switchBtn.addEventListener('click', function () {
            state.scope = 'all';
            renderAgenda();
          });
        }
      } else {
        els.extraMatchesHint.classList.add('hidden');
      }
    } else {
      els.extraMatchesHint.classList.add('hidden');
    }

    els.loadingState.classList.add('hidden');

    if (visible.length === 0) {
      els.tableWrapper.classList.add('hidden');
      els.emptyState.classList.remove('hidden');
      els.emptyStateTitle.textContent = hasActiveFilter
        ? 'Nenhum registro corresponde aos filtros aplicados'
        : 'Nenhum prazo em atenção para esta data';
      els.emptyStateDesc.textContent = hasActiveFilter
        ? 'Limpe os filtros ou alterne para "Toda a agenda" para consultar outros dias.'
        : 'Navegue para outra data ou clique em "Toda a agenda" para consultar todos os registros.';
      return;
    }

    els.emptyState.classList.add('hidden');
    els.tableWrapper.classList.remove('hidden');

    var nowMs = Date.now();
    var doRowCascade = !state.hasAnimatedInitial;
    var rowsHtml = visible.map(function (rec, rowIdx) {
      var cls = classifyForDate(rec, refIso);
      var key = recordKey(rec);
      var fatalDisplay = (rec.dataFatal && rec.dataFatal.display) || '';
      var juntadaDisplay = (rec.dataJuntada && rec.dataJuntada.display) || '';

      var fatalClass = 'col-date';
      if (!fatalDisplay) fatalClass += ' is-empty';
      else if (cls.isFatalOnDate) fatalClass += ' is-today';
      else if (cls.isPendingReview) fatalClass += ' is-past-pending';

      var juntadaClass = 'col-date';
      if (!juntadaDisplay) juntadaClass += ' is-empty';
      else if (cls.isJuntadaOnDate) juntadaClass += ' is-juntada-today';

      var protClass = isProtocoladoSim(rec.protocolado)
        ? 'prot-sim'
        : (isProtocoladoNao(rec.protocolado) ? 'prot-nao' : 'badge-neutral');

      var actionLabel = state.userAccess.canEdit ? 'Abrir / Editar' : 'Consultar';
      var isJustCreated = Boolean(state.lastCreatedId && rec.id === state.lastCreatedId && nowMs < state.lastCreatedUntil);

      var rowClasses = [];
      if (cls.isPendingReview) rowClasses.push('row-pending');
      var prioRowCls = rowPriorityClass(rec.priorizacao);
      if (prioRowCls) rowClasses.push(prioRowCls);
      if (isJustCreated) rowClasses.push('row-just-created');
      else if (doRowCascade && rowIdx < 16) rowClasses.push('row-animate-in');

      var rowStyle = doRowCascade && !isJustCreated && rowIdx < 16
        ? ' style="--row-delay:' + (rowIdx * 36) + 'ms"'
        : '';

      var attentionHtml = renderAttentionBadgesHtml(cls, rec);
      if (isJustCreated) {
        attentionHtml = attentionHtml.replace('<div class="badge-stack">', '<div class="badge-stack"><span class="badge badge-novo-proc">Novo</span>');
      }

      return (
        '<tr data-record-key="' + escapeHtml(key) + '" class="' + rowClasses.join(' ') + '"' + rowStyle + '>' +
          '<td>' + attentionHtml + '</td>' +
          '<td class="' + fatalClass + '">' + escapeHtml(fatalDisplay) + '</td>' +
          '<td class="' + juntadaClass + '">' + escapeHtml(juntadaDisplay) + '</td>' +
          '<td class="col-processo">' +
            '<div class="proc-num">' + escapeHtml(rec.numeroProcesso || '') + '</div>' +
            '<div class="proc-sub">' +
              escapeHtml(rec.tribunal || 'Tribunal não informado') +
              (rec.tipo ? ' • ' + escapeHtml(rec.tipo) : '') +
            '</div>' +
          '</td>' +
          '<td class="col-cliente">' + escapeHtml(rec.cliente || '') + '</td>' +
          '<td class="col-resp">' +
            (rec.responsavel
              ? '<div class="resp-cell"><span class="resp-avatar-sm">' + escapeHtml(getInitials(rec.responsavel)) + '</span><span>' + escapeHtml(rec.responsavel) + '</span></div>'
              : '<span style="color:var(--text-muted)">—</span>') +
          '</td>' +
          '<td>' +
            (rec.priorizacao
              ? '<span class="badge ' + priorityClass(rec.priorizacao) + '">' + escapeHtml(rec.priorizacao) + '</span>'
              : '') +
          '</td>' +
          '<td class="col-passos"><div class="passos-preview" title="' + escapeHtml(rec.proximosPassos || '') + '">' +
            (state.userAccess.canEdit ? '<button type="button" data-steps class="steps-edit">' + escapeHtml(rec.proximosPassos || 'Escrever próximos passos') + '</button>' : escapeHtml(rec.proximosPassos || '')) +
          '</div></td>' +
          '<td class="col-protocolo">' +
            (function () {
              var isSim = isProtocoladoSim(rec.protocolado);
              var labelTxt = isSim ? 'Sim' : 'Não';
              var nextTxt = isSim ? 'Não' : 'Sim';
              var checkSvg = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5 6.5 11.5 12.5 4.5"/></svg>';
              if (state.userAccess.canEdit) {
                return '<button type="button" class="proto-check ' + (isSim ? 'is-sim' : 'is-nao') + '" data-toggle-protocolado="' + nextTxt + '" aria-pressed="' + (isSim ? 'true' : 'false') + '" title="Clique para alternar Protocolado para ' + nextTxt + '">' +
                  '<span class="proto-check-box">' + checkSvg + '</span>' +
                  '<span>' + labelTxt + '</span>' +
                '</button>';
              }
              return '<span class="proto-check is-readonly ' + (isSim ? 'is-sim' : 'is-nao') + '" title="Protocolado: ' + labelTxt + ' (somente leitura)">' +
                '<span class="proto-check-box">' + checkSvg + '</span>' +
                '<span>' + labelTxt + '</span>' +
              '</span>';
            })() +
          '</td>' +
          '<td><button type="button" class="btn btn-sm" data-open-key="' + escapeHtml(key) + '">' + actionLabel + '</button></td>' +
        '</tr>'
      );
    }).join('');

    els.agendaTableBody.innerHTML = rowsHtml;
    if (state.records.length > 0) {
      state.hasAnimatedInitial = true;
    }
  }

  /* -------------------- Dashboard Analítico (Gráficos Interativos) -------------------- */

  function getInitials(name) {
    var parts = String(name || '').trim().split(/\s+/).filter(Boolean);
    if (parts.length === 0) return '—';
    if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
    return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
  }

  function parseBrDatePrefixToIso(text) {
    var match = String(text || '').trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    if (!match) return null;
    return match[3] + '-' + String(match[2]).padStart(2, '0') + '-' + String(match[1]).padStart(2, '0');
  }

  function formatShortBr(iso) {
    if (!iso || iso.length < 10) return '';
    return iso.slice(8, 10) + '/' + iso.slice(5, 7);
  }

  function renderHeroSparkline(buckets, animate) {
    if (!els.heroSparkline) return;
    if (!buckets || buckets.length < 2) {
      els.heroSparkline.innerHTML = '';
      return;
    }
    var w = 220;
    var h = 96;
    var maxV = Math.max.apply(null, buckets.map(function (b) { return b.total; }).concat([1]));
    var pts = buckets.map(function (b, i) {
      var x = 8 + (i * (w - 18)) / Math.max(1, buckets.length - 1);
      var y = 14 + ((maxV - b.total) * (h - 28)) / maxV;
      return [x, y];
    });
    var dLine = buildSmoothBezierPath(pts);
    var dArea = dLine + ' L' + pts[pts.length - 1][0].toFixed(1) + ' ' + h + ' L' + pts[0][0].toFixed(1) + ' ' + h + ' Z';
    var refIdx = buckets.findIndex(function (b) { return b.isRef; });
    if (refIdx < 0) refIdx = pts.length - 1;
    var refPt = pts[refIdx];
    var anim = animate && !prefersReducedMotion();

    els.heroSparkline.innerHTML =
      '<svg viewBox="0 0 ' + w + ' ' + h + '" aria-hidden="true">' +
        '<defs>' +
          '<linearGradient id="heroSparkGrad" x1="0" y1="0" x2="0" y2="1">' +
            '<stop offset="0%" stop-color="#c0a68d" stop-opacity="0.34" />' +
            '<stop offset="100%" stop-color="#c0a68d" stop-opacity="0" />' +
          '</linearGradient>' +
          '<filter id="heroSparkGlow" filterUnits="userSpaceOnUse" x="-16" y="-16" width="' + (w + 32) + '" height="' + (h + 32) + '">' +
            '<feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b" />' +
            '<feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>' +
          '</filter>' +
        '</defs>' +
        '<path' + (anim ? ' class="neon-surge" style="--surge-delay:0.45s"' : '') + ' d="' + dArea + '" fill="url(#heroSparkGrad)" />' +
        '<path' + (anim ? ' class="neon-draw"' : '') + ' filter="url(#heroSparkGlow)" pathLength="1" d="' + dLine + '" fill="none" stroke="#c0a68d" stroke-width="2.1" stroke-linecap="round" />' +
        '<g class="neon-beacon' + (anim ? ' neon-surge' : '') + '" style="--surge-delay:0.85s">' +
          '<circle class="neon-halo" cx="' + refPt[0].toFixed(1) + '" cy="' + refPt[1].toFixed(1) + '" r="8" fill="#c0a68d" opacity="0.35" />' +
          '<circle cx="' + refPt[0].toFixed(1) + '" cy="' + refPt[1].toFixed(1) + '" r="3.6" fill="#e5d2be" stroke="#0c0c0d" stroke-width="1.5" />' +
        '</g>' +
      '</svg>';
  }

  function renderTimelineChart(records, refIso, animate) {
    if (!els.chartTimeline) return;
    var mode = state.timelineMode || 'prazos';
    var buckets = [];
    var doAnim = Boolean(animate) && !prefersReducedMotion();

    if (mode === 'prazos') {
      if (els.timelineChartTitle) els.timelineChartTitle.textContent = 'Fluxo de prazos por dia';
      if (els.timelineChartSub) els.timelineChartSub.textContent = 'Prazos fatais e juntadas ao redor da data consultada • clique em um dia para navegar';

      for (var d = -4; d <= 5; d++) {
        var dayIso = shiftIsoDate(refIso, d);
        var total = 0;
        var pending = 0;
        for (var i = 0; i < records.length; i++) {
          var r = records[i];
          var fIso = r.dataFatal && r.dataFatal.iso;
          var jIso = r.dataJuntada && r.dataJuntada.iso;
          if (fIso === dayIso || jIso === dayIso) {
            total++;
            if (isProtocoladoNao(r.protocolado)) pending++;
          }
        }
        buckets.push({ iso: dayIso, label: formatShortBr(dayIso), total: total, pending: pending, isRef: dayIso === refIso });
      }
      renderHeroSparkline(buckets, doAnim);
    } else {
      if (els.timelineChartTitle) els.timelineChartTitle.textContent = 'Entrada e movimentação de processos por data';
      if (els.timelineChartSub) els.timelineChartSub.textContent = 'Volume de entradas (histórico de criação) e atualizações registradas na agenda';

      var map = {};
      for (var k = 0; k < records.length; k++) {
        var rec = records[k];
        var createdEntry = (rec.history || []).find(function (e) { return normalizeText(e.action) === 'criacao'; });
        var iso = parseBrDatePrefixToIso((createdEntry && createdEntry.at) || rec.ultimaAtualizacao);
        if (!iso) continue;
        if (!map[iso]) map[iso] = { iso: iso, label: formatShortBr(iso), total: 0, pending: 0, isRef: iso === refIso };
        map[iso].total++;
        if (isProtocoladoNao(rec.protocolado)) map[iso].pending++;
      }
      buckets = Object.keys(map).sort().slice(-10).map(function (key) { return map[key]; });
      if (buckets.length === 0) {
        els.chartTimeline.innerHTML = '<div style="padding:36px 12px; text-align:center; color:#aba399; font-size:13px;">Sem datas de entrada ou atualização disponíveis.</div>';
        return;
      }
    }

    var maxVal = 1;
    for (var m = 0; m < buckets.length; m++) {
      if (buckets[m].total > maxVal) maxVal = buckets[m].total;
    }

    var svgW = 560;
    var svgH = 216;
    var padL = 24;
    var padR = 16;
    var padT = 28;
    var padB = 34;
    var plotW = svgW - padL - padR;
    var plotH = svgH - padT - padB;
    var step = plotW / Math.max(buckets.length, 1);
    var barW = Math.min(32, Math.max(16, step * 0.52));
    var baseY = padT + plotH;

    var gridLines = '';
    for (var g = 0; g <= 3; g++) {
      var gy = padT + (plotH * g) / 3;
      gridLines += '<line x1="' + padL + '" y1="' + gy.toFixed(1) + '" x2="' + (svgW - padR) + '" y2="' + gy.toFixed(1) + '" stroke="' + (g === 3 ? 'rgba(192,166,141,0.34)' : 'rgba(255,255,255,0.09)') + '"' + (g < 3 ? ' stroke-dasharray="2 5"' : '') + ' stroke-width="1" />';
    }

    var linePts = [];
    var barsSvg = '';
    var refPt = null;

    for (var b = 0; b < buckets.length; b++) {
      var item = buckets[b];
      var cx = padL + step * b + step / 2;
      var h = item.total > 0 ? Math.max(10, (item.total / maxVal) * plotH) : 2;
      var y = baseY - h;
      var lineY = baseY - (item.total / maxVal) * plotH;
      linePts.push([cx, lineY]);
      if (item.isRef) refPt = [cx, lineY];

      var bx = cx - barW / 2;
      var rTop = Math.min(5, barW / 2, h);
      var barPath = 'M' + bx.toFixed(1) + ' ' + baseY.toFixed(1) +
        ' V' + (y + rTop).toFixed(1) +
        ' Q' + bx.toFixed(1) + ' ' + y.toFixed(1) + ' ' + (bx + rTop).toFixed(1) + ' ' + y.toFixed(1) +
        ' H' + (bx + barW - rTop).toFixed(1) +
        ' Q' + (bx + barW).toFixed(1) + ' ' + y.toFixed(1) + ' ' + (bx + barW).toFixed(1) + ' ' + (y + rTop).toFixed(1) +
        ' V' + baseY.toFixed(1) + ' Z';

      var barFill = item.isRef ? 'url(#neonBarChampagne)' : (item.total > 0 ? 'url(#neonBarIvory)' : 'rgba(255,255,255,0.08)');
      var barFilter = item.isRef ? ' filter="url(#neonGlowSoft)"' : '';
      var labelColor = item.isRef ? '#e4cfba' : '#968f86';
      var labelWeight = item.isRef ? '700' : '500';
      var pendingH = item.pending > 0 ? Math.min(h, Math.max(4, (item.pending / maxVal) * plotH)) : 0;
      var animAttr = doAnim ? ' class="timeline-bar timeline-bar-anim" style="--bar-delay:' + (b * 45) + 'ms"' : ' class="timeline-bar"';

      barsSvg +=
        '<g class="timeline-bar-group" data-chart-date="' + escapeHtml(item.iso) + '">' +
          '<title>' + escapeHtml(item.label + ': ' + item.total + ' processo(s), ' + item.pending + ' não protocolado(s)') + '</title>' +
          (item.isRef ? '<line x1="' + cx.toFixed(1) + '" y1="' + padT + '" x2="' + cx.toFixed(1) + '" y2="' + baseY.toFixed(1) + '" stroke="rgba(192,166,141,0.38)" stroke-dasharray="3 3" stroke-width="1" />' : '') +
          '<path d="' + barPath + '" fill="' + barFill + '"' + barFilter + animAttr + ' />' +
          (pendingH > 0 && item.total > 0 && !item.isRef
            ? '<rect x="' + bx.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + barW.toFixed(1) + '" height="' + Math.min(4, pendingH).toFixed(1) + '" rx="2" fill="#d94854"' + (doAnim ? ' class="neon-surge" style="--surge-delay:' + (260 + b * 45) + 'ms"' : '') + ' />'
            : '') +
          (item.total > 0
            ? '<text x="' + cx.toFixed(1) + '" y="' + (y - 9).toFixed(1) + '" text-anchor="middle" font-size="11" font-weight="700" font-family="var(--font-mono)" fill="' + (item.isRef ? '#ead7c3' : '#f5f2ed') + '"' + (doAnim ? ' class="neon-surge" style="--surge-delay:' + (220 + b * 45) + 'ms"' : '') + '>' + item.total + '</text>'
            : '') +
          '<text x="' + cx.toFixed(1) + '" y="' + (svgH - 10) + '" text-anchor="middle" font-size="10.5" font-weight="' + labelWeight + '" font-family="var(--font-mono)" fill="' + labelColor + '">' + escapeHtml(item.label) + '</text>' +
        '</g>';
    }

    var curveSvg = '';
    if (linePts.length > 1) {
      var smoothD = buildSmoothBezierPath(linePts);
      var areaD = smoothD + ' L' + linePts[linePts.length - 1][0].toFixed(1) + ' ' + baseY.toFixed(1) + ' L' + linePts[0][0].toFixed(1) + ' ' + baseY.toFixed(1) + ' Z';
      curveSvg =
        '<path' + (doAnim ? ' class="neon-surge" style="--surge-delay:0.35s"' : '') + ' d="' + areaD + '" fill="url(#champagneNeonArea)" />' +
        '<path' + (doAnim ? ' class="neon-draw"' : '') + ' filter="url(#neonGlowLine)" pathLength="1" d="' + smoothD + '" fill="none" stroke="#d5bc9f" stroke-width="2.3" stroke-linecap="round" />';
    }

    var beaconSvg = refPt
      ? '<g class="neon-beacon' + (doAnim ? ' neon-surge' : '') + '" style="--surge-delay:0.75s">' +
          '<circle class="neon-halo" cx="' + refPt[0].toFixed(1) + '" cy="' + refPt[1].toFixed(1) + '" r="10" fill="#c0a68d" opacity="0.45" />' +
          '<circle cx="' + refPt[0].toFixed(1) + '" cy="' + refPt[1].toFixed(1) + '" r="4.5" fill="#ead7c3" stroke="#0c0c0d" stroke-width="2" />' +
        '</g>'
      : '';

    var defsSvg =
      '<defs>' +
        '<linearGradient id="neonBarChampagne" x1="0" y1="0" x2="0" y2="1">' +
          '<stop offset="0%" stop-color="#e5cfb8" stop-opacity="1" />' +
          '<stop offset="65%" stop-color="#c0a68d" stop-opacity="0.88" />' +
          '<stop offset="100%" stop-color="#c0a68d" stop-opacity="0.22" />' +
        '</linearGradient>' +
        '<linearGradient id="neonBarIvory" x1="0" y1="0" x2="0" y2="1">' +
          '<stop offset="0%" stop-color="#ffffff" stop-opacity="0.92" />' +
          '<stop offset="100%" stop-color="#c0a68d" stop-opacity="0.22" />' +
        '</linearGradient>' +
        '<linearGradient id="champagneNeonArea" x1="0" y1="0" x2="0" y2="1">' +
          '<stop offset="0%" stop-color="#c0a68d" stop-opacity="0.26" />' +
          '<stop offset="100%" stop-color="#c0a68d" stop-opacity="0" />' +
        '</linearGradient>' +
        '<filter id="neonGlowLine" filterUnits="userSpaceOnUse" x="-20" y="-20" width="' + (svgW + 40) + '" height="' + (svgH + 40) + '">' +
          '<feGaussianBlur in="SourceGraphic" stdDeviation="3.4" result="b" />' +
          '<feComponentTransfer in="b" result="c"><feFuncA type="linear" slope="0.9" /></feComponentTransfer>' +
          '<feMerge><feMergeNode in="c" /><feMergeNode in="SourceGraphic" /></feMerge>' +
        '</filter>' +
        '<filter id="neonGlowSoft" filterUnits="userSpaceOnUse" x="-20" y="-20" width="' + (svgW + 40) + '" height="' + (svgH + 40) + '">' +
          '<feGaussianBlur in="SourceGraphic" stdDeviation="2.6" result="b" />' +
          '<feComponentTransfer in="b" result="c"><feFuncA type="linear" slope="0.6" /></feComponentTransfer>' +
          '<feMerge><feMergeNode in="c" /><feMergeNode in="SourceGraphic" /></feMerge>' +
        '</filter>' +
      '</defs>';

    els.chartTimeline.innerHTML =
      '<svg class="timeline-svg" viewBox="0 0 ' + svgW + ' ' + svgH + '" role="img" aria-label="Gráfico neon de volume por data">' +
        defsSvg + gridLines + curveSvg + barsSvg + beaconSvg +
      '</svg>';
  }

  function renderResponsaveisChart(records, animate) {
    if (!els.chartResponsaveis) return;
    var doAnim = Boolean(animate) && !prefersReducedMotion();
    var counts = {};
    for (var i = 0; i < records.length; i++) {
      var name = String(records[i].responsavel || '').trim() || 'Não atribuído';
      if (!counts[name]) counts[name] = { name: name, total: 0, pending: 0 };
      counts[name].total++;
      if (isProtocoladoNao(records[i].protocolado)) counts[name].pending++;
    }
    var ranked = Object.keys(counts).map(function (k) { return counts[k]; }).sort(function (a, b) {
      if (b.total !== a.total) return b.total - a.total;
      return a.name.localeCompare(b.name, 'pt-BR');
    });

    if (ranked.length === 0) {
      if (els.topOwnerBadge) els.topOwnerBadge.textContent = 'Sem dados';
      els.chartResponsaveis.innerHTML = '<div style="color:var(--text-muted); font-size:13px;">Nenhum processo carregado.</div>';
      return;
    }

    var top = ranked[0];
    if (els.topOwnerBadge) {
      els.topOwnerBadge.textContent = 'Líder: ' + top.name + ' (' + top.total + ')';
    }

    var maxTotal = Math.max(top.total, 1);
    els.chartResponsaveis.innerHTML = ranked.slice(0, 6).map(function (item, idx) {
      var pct = Math.max(8, Math.round((item.total / maxTotal) * 100));
      var active = state.filters.responsavel && normalizeText(state.filters.responsavel) === normalizeText(item.name);
      var barCls = (idx === 0 ? 'bar-fill-brand' : 'bar-fill-main') + (doAnim ? ' bar-anim-x' : '');
      var rankNum = String(idx + 1).padStart(2, '0');
      return (
        '<button type="button" class="rank-row' + (active ? ' is-active-filter' : '') + '" data-chart-resp="' + escapeHtml(item.name) + '">' +
          '<div class="rank-row-head">' +
            '<div class="rank-person">' +
              '<span class="rank-ordinal">' + rankNum + '</span>' +
              '<span class="avatar-chip' + (idx === 0 ? ' top-leader' : '') + '">' + escapeHtml(getInitials(item.name)) + '</span>' +
              '<span class="rank-name">' + escapeHtml(item.name) + '</span>' +
              (idx === 0 ? '<span class="rank-crown">Maior carga</span>' : '') +
            '</div>' +
            '<span class="rank-counts">' + item.total + '<small>(' + item.pending + ' pend.)</small></span>' +
          '</div>' +
          '<div class="bar-track"><div class="' + barCls + '" style="width:' + pct + '%;--bar-delay:' + (idx * 65) + 'ms"></div></div>' +
        '</button>'
      );
    }).join('');
  }

  function renderProtocoloDonut(records, animate) {
    if (!els.chartProtocolo) return;
    var doAnim = Boolean(animate) && !prefersReducedMotion();
    var sim = 0;
    var nao = 0;
    var outros = 0;
    for (var i = 0; i < records.length; i++) {
      if (isProtocoladoSim(records[i].protocolado)) sim++;
      else if (isProtocoladoNao(records[i].protocolado)) nao++;
      else outros++;
    }
    var total = Math.max(records.length, 1);
    var pctSim = Math.round((sim / total) * 100);
    var r = 52;
    var circ = 2 * Math.PI * r;
    var dashSim = (sim / total) * circ;
    var dashNao = (nao / total) * circ;

    var activeSim = normalizeText(state.filters.protocolado) === 'sim';
    var activeNao = normalizeText(state.filters.protocolado) === 'nao';

    els.chartProtocolo.innerHTML =
      '<div class="donut-wrap">' +
        '<svg class="' + (doAnim ? 'donut-svg-anim' : '') + '" width="138" height="138" viewBox="0 0 138 138">' +
          '<defs>' +
            '<filter id="donutNeonGlow" x="-20%" y="-20%" width="140%" height="140%">' +
              '<feGaussianBlur in="SourceGraphic" stdDeviation="2.4" result="b" />' +
              '<feComponentTransfer in="b" result="c"><feFuncA type="linear" slope="0.55" /></feComponentTransfer>' +
              '<feMerge><feMergeNode in="c" /><feMergeNode in="SourceGraphic" /></feMerge>' +
            '</filter>' +
          '</defs>' +
          '<circle cx="69" cy="69" r="' + r + '" fill="none" stroke="#efeae2" stroke-width="14" />' +
          '<circle cx="69" cy="69" r="' + r + '" fill="none" stroke="#c0a68d" filter="url(#donutNeonGlow)" stroke-width="14" stroke-dasharray="' + dashNao.toFixed(1) + ' ' + circ.toFixed(1) + '" stroke-dashoffset="' + (-dashSim).toFixed(1) + '" transform="rotate(-90 69 69)" />' +
          '<circle cx="69" cy="69" r="' + r + '" fill="none" stroke="#0e0e10" stroke-width="14" stroke-dasharray="' + dashSim.toFixed(1) + ' ' + circ.toFixed(1) + '" transform="rotate(-90 69 69)" />' +
        '</svg>' +
        '<div class="donut-center">' +
          '<span id="donutPctValue" class="donut-pct">' + pctSim + '%</span>' +
          '<span class="donut-pct-label">Protocolado</span>' +
        '</div>' +
      '</div>' +
      '<div class="donut-legend">' +
        '<button type="button" class="legend-btn' + (activeSim ? ' is-active-filter' : '') + '" data-chart-proto="Sim">' +
          '<span class="legend-btn-left"><i class="legend-dot" style="background:#0e0e10"></i>Protocolado (Sim)</span>' +
          '<span class="legend-btn-val">' + sim + '</span>' +
        '</button>' +
        '<button type="button" class="legend-btn' + (activeNao ? ' is-active-filter' : '') + '" data-chart-proto="Não">' +
          '<span class="legend-btn-left"><i class="legend-dot" style="background:#c0a68d; box-shadow:0 0 8px rgba(192,166,141,0.7)"></i>Pendente (Não)</span>' +
          '<span class="legend-btn-val">' + nao + '</span>' +
        '</button>' +
        (outros > 0
          ? '<div style="font-size:11.5px; color:var(--text-muted); padding:0 4px;">Sem marcação: <strong>' + outros + '</strong></div>'
          : '') +
      '</div>';

    var pctEl = document.getElementById('donutPctValue');
    if (doAnim && pctEl) {
      var fromPct = !state.hasAnimatedInitial ? 0 : state.prevKpis.protoPct;
      animateNumber(pctEl, pctSim, fromPct, '%', 720);
    }
    state.prevKpis.protoPct = pctSim;
  }

  function renderPrioridadesChart(records, animate) {
    if (!els.chartPrioridades) return;
    var doAnim = Boolean(animate) && !prefersReducedMotion();
    var counts = {};
    for (var i = 0; i < records.length; i++) {
      var p = String(records[i].priorizacao || '').trim() || 'Sem classificação';
      counts[p] = (counts[p] || 0) + 1;
    }
    var list = Object.keys(counts).map(function (k) {
      return { name: k, total: counts[k], rank: PRIORITY_RANK[normalizeText(k)] || 50 };
    }).sort(function (a, b) {
      if (a.rank !== b.rank) return a.rank - b.rank;
      return b.total - a.total;
    });

    var maxVal = Math.max.apply(null, list.map(function (x) { return x.total; }).concat([1]));
    els.chartPrioridades.innerHTML = list.slice(0, 5).map(function (item, idx) {
      var pct = Math.max(8, Math.round((item.total / maxVal) * 100));
      var n = normalizeText(item.name);
      var fillCls = (n === 'urgente' ? 'bar-fill-danger' : (n === 'alta' ? 'bar-fill-main' : 'bar-fill-brand')) + (doAnim ? ' bar-anim-x' : '');
      var active = state.filters.priorizacao && normalizeText(state.filters.priorizacao) === n;
      return (
        '<button type="button" class="mini-bar-btn' + (active ? ' is-active-filter' : '') + '" data-chart-prio="' + escapeHtml(item.name) + '">' +
          '<div class="mini-bar-top"><span>' + escapeHtml(item.name) + '</span><span>' + item.total + '</span></div>' +
          '<div class="bar-track"><div class="' + fillCls + '" style="width:' + pct + '%;--bar-delay:' + (idx * 65) + 'ms"></div></div>' +
        '</button>'
      );
    }).join('');
  }

  function renderTribunaisChart(records, animate) {
    if (!els.chartTribunais) return;
    var doAnim = Boolean(animate) && !prefersReducedMotion();
    var counts = {};
    for (var i = 0; i < records.length; i++) {
      var t = String(records[i].tribunal || '').trim() || 'Não informado';
      counts[t] = (counts[t] || 0) + 1;
    }
    var list = Object.keys(counts).map(function (k) {
      return { name: k, total: counts[k] };
    }).sort(function (a, b) {
      if (b.total !== a.total) return b.total - a.total;
      return a.name.localeCompare(b.name, 'pt-BR');
    });

    var maxVal = Math.max.apply(null, list.map(function (x) { return x.total; }).concat([1]));
    els.chartTribunais.innerHTML = list.slice(0, 5).map(function (item, idx) {
      var pct = Math.max(10, Math.round((item.total / maxVal) * 100));
      var active = state.filters.tribunal && normalizeText(state.filters.tribunal) === normalizeText(item.name);
      var fillCls = (idx === 0 ? 'bar-fill-brand' : 'bar-fill-main') + (doAnim ? ' bar-anim-x' : '');
      return (
        '<button type="button" class="mini-bar-btn' + (active ? ' is-active-filter' : '') + '" data-chart-tribunal="' + escapeHtml(item.name) + '">' +
          '<div class="mini-bar-top"><span>' + escapeHtml(item.name) + '</span><span>' + item.total + '</span></div>' +
          '<div class="bar-track"><div class="' + fillCls + '" style="width:' + pct + '%;--bar-delay:' + (idx * 65) + 'ms"></div></div>' +
        '</button>'
      );
    }).join('');
  }

  function renderAnalytics(refIso, animate) {
    if (!state.showAnalytics) return;
    // Linhas incompletas ficam na agenda (com aviso), mas não entram nos gráficos.
    var chartRecords = state.records.filter(isCompleteRecord);
    renderTimelineChart(chartRecords, refIso, animate);
    renderResponsaveisChart(chartRecords, animate);
    renderProtocoloDonut(chartRecords, animate);
    renderPrioridadesChart(chartRecords, animate);
    renderTribunaisChart(chartRecords, animate);
  }

  /* -------------------- Modal de Detalhe, Edição, Confirmação e Conflito -------------------- */

  function populateEditSelectWithCurrent(selectEl, catalogOptions, currentVal) {
    var list = catalogOptions.slice();
    if (currentVal && list.map(normalizeText).indexOf(normalizeText(currentVal)) === -1) {
      list.push(currentVal);
    }
    var html = '<option value=""></option>';
    for (var i = 0; i < list.length; i++) {
      html += '<option value="' + escapeHtml(list[i]) + '">' + escapeHtml(list[i]) + '</option>';
    }
    selectEl.innerHTML = html;
    selectEl.value = currentVal || '';
  }

  function openRecordModal(key) {
    var rec = null;
    for (var i = 0; i < state.records.length; i++) {
      if (recordKey(state.records[i]) === key) {
        rec = state.records[i];
        break;
      }
    }
    if (key === null && state.userAccess.canEdit && state.extended) rec = { creating: true, draftId: 'PRZ-' + crypto.randomUUID() };
    if (!rec) return;

    state.selectedRecordKey = key;
    state.selectedRecord = rec;
    state.pendingDiffs = [];

    els.conflictPanel.classList.add('hidden');
    els.confirmSavePanel.classList.add('hidden');

    els.modalTitle.textContent = rec.creating ? 'Novo processo' : rec.numeroProcesso || 'Registro sem número de processo';
    els.modalSubtitle.textContent = (rec.cliente || 'Cliente não informado') + ' • ' + (rec.tribunal || 'Tribunal não informado');

    els.detProcesso.textContent = rec.numeroProcesso || '';
    els.detCliente.textContent = rec.cliente || '';
    els.detTribunal.textContent = rec.tribunal || '';
    els.detTipo.textContent = rec.tipo || '';
    els.detUltimaAtualizacao.textContent = rec.ultimaAtualizacao || '';
    els.detMetaIds.textContent = 'Col. A: "' + (rec.colA || '') + '" • ID: ' + (rec.id || 'Será gerado ao salvar');

    // Preserva exatamente as 4 datas separadas (vazias ficam vazias)
    els.detFimDoPrazo.textContent = (rec.fimDoPrazo && rec.fimDoPrazo.display) || '';
    els.detPrazoLimiteJuntada.textContent = (rec.prazoLimiteJuntada && rec.prazoLimiteJuntada.display) || '';
    els.detDataFatal.textContent = (rec.dataFatal && rec.dataFatal.display) || '';
    els.detDataJuntada.textContent = (rec.dataJuntada && rec.dataJuntada.display) || '';

    var cls = classifyForDate(rec, state.referenceDateIso || state.meta.todayIso);
    els.detAttentionTags.innerHTML = renderAttentionBadgesHtml(cls, rec);

    // Popula campos editáveis
    els.editProximosPassos.value = rec.proximosPassos || '';
    populateEditSelectWithCurrent(els.editResponsavel, state.managed.responsavel || [], rec.responsavel || '');
    populateEditSelectWithCurrent(els.editPriorizacao, state.managed.priorizacao || [], rec.priorizacao || '');
    EDITABLE_FIELDS.filter(function (f) { return f.extended; }).forEach(function (f) {
      document.getElementById(f.elId).value = f.date ? (rec[f.key] || {}).iso || '' : rec[f.key] || '';
    });
    var history = rec.history || [];
    document.getElementById('recordHistory').innerHTML = history.length ? history.slice().reverse().map(function (e) {
      return '<li>' + escapeHtml([e.at, e.action, e.email, e.fields].join(' · ')) + '</li>';
    }).join('') : '<li>Sem histórico registrado pelo aplicativo.</li>';
    populateEditSelectWithCurrent(els.editProtocolado, state.options.protocolado || ['Não', 'Sim'], rec.protocolado || '');
    els.editObservacaoM.value = rec.observacaoM || '';
    els.editObservacaoP.value = rec.observacaoP || '';

    var canEdit = Boolean(state.userAccess.canEdit);
    els.viewerNotice.classList.toggle('hidden', canEdit);
    for (var f = 0; f < EDITABLE_FIELDS.length; f++) {
      var inputEl = document.getElementById(EDITABLE_FIELDS[f].elId);
      if (inputEl) inputEl.disabled = !canEdit || (EDITABLE_FIELDS[f].extended && !state.extended);
    }

    els.btnReviewSave.classList.toggle('hidden', !canEdit);
    els.btnReviewSave.disabled = true;
    els.modalFooterStatus.textContent = canEdit
      ? 'Altere os campos desejados e clique em "Revisar e salvar".'
      : 'Modo consulta (somente leitura).';

    els.modalBackdrop.classList.remove('hidden');
  }

  function closeRecordModal() {
    if (state.isSaving) return;
    els.modalBackdrop.classList.add('hidden');
    state.selectedRecordKey = null;
    state.selectedRecord = null;
    state.pendingDiffs = [];
  }

  function collectFormDiffs() {
    if (!state.selectedRecord) return [];
    var diffs = [];
    for (var i = 0; i < EDITABLE_FIELDS.length; i++) {
      var field = EDITABLE_FIELDS[i];
      var inputEl = document.getElementById(field.elId);
      if (inputEl.disabled) continue;
      var original = state.selectedRecord[field.key];
      var beforeVal = field.date ? (original || {}).iso || '' : String(original || '').trim();
      var afterVal = String((inputEl && inputEl.value) || '').trim();
      if (beforeVal !== afterVal) {
        diffs.push({
          field: field.key,
          label: field.label,
          before: beforeVal,
          after: afterVal
        });
      }
    }
    return diffs;
  }

  function onEditFormChanged() {
    if (!state.userAccess.canEdit || state.isSaving) return;
    var diffs = collectFormDiffs();
    els.confirmSavePanel.classList.add('hidden');
    els.btnReviewSave.disabled = diffs.length === 0;
    els.modalFooterStatus.textContent = diffs.length > 0
      ? diffs.length + ' campo(s) alterado(s) — aguardando revisão e confirmação.'
      : 'Nenhuma alteração pendente.';
  }

  function showPreSaveConfirmation() {
    if (!state.userAccess.canEdit || !state.selectedRecord) return;
    var diffs = collectFormDiffs();
    if (diffs.length === 0) {
      showToast('Nenhuma alteração para gravar.', 'warn');
      return;
    }

    if (state.selectedRecord.creating) {
      if (!document.getElementById('edit_numeroProcesso').value.trim()) {
        showToast('Informe o número do processo.', 'warn');
        document.getElementById('edit_numeroProcesso').focus();
        return;
      }
      if (!document.getElementById('edit_cliente').value.trim()) {
        showToast('Informe o cliente do processo.', 'warn');
        document.getElementById('edit_cliente').focus();
        return;
      }
    }
    state.pendingDiffs = diffs;
    var rec = state.selectedRecord;

    els.confirmContextBox.innerHTML =
      '<div><strong>Processo:</strong> <span style="font-family:var(--font-mono)">' + escapeHtml(rec.numeroProcesso || '(vazio)') + '</span></div>' +
      '<div><strong>Cliente:</strong> ' + escapeHtml(rec.cliente || '(vazio)') + '</div>' +
      '<div><strong>Prazo deste registro:</strong> ' +
        'Data fatal: <strong>' + escapeHtml((rec.dataFatal && rec.dataFatal.display) || '(vazio)') + '</strong>' +
        ' • Data juntada: <strong>' + escapeHtml((rec.dataJuntada && rec.dataJuntada.display) || '(vazio)') + '</strong>' +
        ' • Tipo: <strong>' + escapeHtml(rec.tipo || '(vazio)') + '</strong>' +
      '</div>' +
      '<div style="color:var(--text-muted); margin-top:3px;">ID estável: ' + escapeHtml(rec.id || 'Será criado na gravação') + ' • Última atualização será renovada somente após confirmação da planilha.</div>';

    els.confirmDiffList.innerHTML = diffs.map(function (d) {
      return (
        '<li><strong>' + escapeHtml(d.label) + ':</strong> ' +
          '<span class="diff-before">' + escapeHtml(d.before || '(vazio)') + '</span>' +
          ' &rarr; ' +
          '<span class="diff-after">' + escapeHtml(d.after || '(vazio)') + '</span>' +
        '</li>'
      );
    }).join('');

    els.confirmSavePanel.classList.remove('hidden');
    els.confirmSavePanel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function executeConfirmedSave() {
    if (!state.userAccess.canEdit || !state.selectedRecord || state.isSaving) return;
    var diffs = collectFormDiffs();
    if (diffs.length === 0) return;

    var changes = {};
    for (var i = 0; i < diffs.length; i++) {
      changes[diffs[i].field] = diffs[i].after;
    }

    var payload = {
      recordId: state.selectedRecord.id,
      tempRowKey: state.selectedRecord.tempRowKey,
      expectedVersion: state.selectedRecord.version,
      changes: changes
    };

    state.isSaving = true;
    els.btnExecuteSave.disabled = true;
    els.btnCancelConfirm.disabled = true;
    els.btnReviewSave.disabled = true;
    els.btnExecuteSave.textContent = 'Gravando na planilha...';
    els.modalFooterStatus.textContent = 'Aguardando confirmação da planilha...';

    var creating = state.selectedRecord.creating;
    if (creating) payload.recordId = state.selectedRecord.draftId;
    callServer(creating ? 'apiCreateRecord' : 'apiSaveRecord', payload)
      .then(function (res) {
        state.isSaving = false;
        els.btnExecuteSave.disabled = false;
        els.btnCancelConfirm.disabled = false;
        els.btnExecuteSave.textContent = 'Confirmar gravação na planilha';

        if (res && res.ok && res.record) {
          // Atualiza o registro local SOMENTE após resposta confirmada da planilha
          var saved = res.record;
          var replaced = false;
          for (var idx = 0; idx < state.records.length; idx++) {
            var cur = state.records[idx];
            if ((saved.id && cur.id === saved.id) || (state.selectedRecord.tempRowKey && cur.tempRowKey === state.selectedRecord.tempRowKey)) {
              state.records[idx] = saved;
              replaced = true;
              break;
            }
          }
          if (!replaced) {
            state.records.push(saved);
          }

          state.animateChartsNext = true;
          populateAllFilterSelects();

          if (creating) {
            state.lastCreatedId = saved.id;
            state.lastCreatedUntil = Date.now() + 9000;
            var refIsoNow = state.referenceDateIso || state.meta.todayIso;
            if (!classifyForDate(saved, refIsoNow).inAttentionView) {
              state.scope = 'all';
            }
            closeRecordModal();
            renderAgenda();
            loadAgendaData({ silent: true });
            showToast('Novo processo incluído e confirmado na planilha (' + saved.numeroProcesso + ').', 'success');
            var newRowEl = els.agendaTableBody.querySelector('tr[data-record-key="' + CSS.escape(recordKey(saved)) + '"]');
            if (newRowEl) {
              newRowEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
            return;
          }

          renderAgenda();
          openRecordModal(recordKey(saved));
          loadAgendaData({ silent: true });
          els.modalFooterStatus.textContent = 'Salvo e confirmado na planilha em ' + (res.savedAt || saved.ultimaAtualizacao) + '.';
          showToast('Alterações confirmadas na planilha (' + saved.numeroProcesso + ').', 'success');
          return;
        }

        if (res && res.code === 'CONFLICT') {
          els.confirmSavePanel.classList.add('hidden');
          showConflictState(res);
          return;
        }

        els.confirmSavePanel.classList.add('hidden');
        var errMsg = (res && res.message) || 'Não foi possível salvar na planilha.';
        els.modalFooterStatus.textContent = errMsg;
        showToast(errMsg, 'error');
      })
      .catch(function (err) {
        state.isSaving = false;
        els.btnExecuteSave.disabled = false;
        els.btnCancelConfirm.disabled = false;
        els.btnExecuteSave.textContent = 'Confirmar gravação na planilha';
        els.modalFooterStatus.textContent = err.message;
        showToast(err.message, 'error');
      });
  }

  function showConflictState(res) {
    els.conflictMessage.textContent = res.message || 'Outro colega alterou este registro na planilha.';
    var cur = res.currentRecord;
    if (cur) {
      els.conflictDetails.innerHTML =
        '<div><strong>Versão atual na planilha</strong> (Última atualização: ' + escapeHtml(cur.ultimaAtualizacao || 'não informada') + '):</div>' +
        '<ul style="margin:6px 0 0 18px; padding:0;">' +
          '<li>Próximos passos: <strong>' + escapeHtml(cur.proximosPassos || '(vazio)') + '</strong></li>' +
          '<li>Responsável: <strong>' + escapeHtml(cur.responsavel || '(vazio)') + '</strong></li>' +
          '<li>Priorização: <strong>' + escapeHtml(cur.priorizacao || '(vazio)') + '</strong></li>' +
          '<li>Protocolado: <strong>' + escapeHtml(cur.protocolado || '(vazio)') + '</strong></li>' +
          '<li>Observação da Controladoria: <strong>' + escapeHtml(cur.observacaoM || '(vazio)') + '</strong></li>' +
          '<li>Observação do Advogado: <strong>' + escapeHtml(cur.observacaoP || '(vazio)') + '</strong></li>' +
        '</ul>';
    } else {
      els.conflictDetails.innerHTML = '';
    }
    els.conflictPanel.classList.remove('hidden');
    els.modalFooterStatus.textContent = 'Gravação interrompida por conflito. Recarregue os dados atuais.';
    showToast('Conflito detectado: registro já alterado por outro colega.', 'warn');
  }

  /* -------------------- Carga de Dados da Planilha -------------------- */

  function loadAgendaData(options) {
    var opts = options || {};
    els.btnRefresh.disabled = true;
    if (!opts.silent) {
      els.loadingState.classList.remove('hidden');
      els.tableWrapper.classList.add('hidden');
      els.emptyState.classList.add('hidden');
    }
    showGlobalAlert('');

    return callServer('apiGetAgendaData')
      .then(function (res) {
        els.btnRefresh.disabled = false;
        if (!res || !res.ok) {
          els.loadingState.classList.add('hidden');
          showGlobalAlert((res && res.message) || 'Erro ao carregar dados da planilha.', 'danger');
          return;
        }

        state.records = res.records || [];
        state.options = res.options || state.options;
        state.managed = res.managedOptions || state.options;
        state.extended = res.editingVersion >= 2;
        state.userAccess = res.userAccess || state.userAccess;
        state.meta = res.meta || state.meta;

        if (!state.referenceDateIso) {
          state.referenceDateIso = state.meta.todayIso;
        }

        renderHeaderAndDemoBanner();
        populateAllFilterSelects();
        renderAgenda();

        if (opts.reopenKey) {
          openRecordModal(opts.reopenKey);
          showToast('Dados atualizados da planilha.', 'info');
        }
      })
      .catch(function (err) {
        els.btnRefresh.disabled = false;
        els.loadingState.classList.add('hidden');
        showGlobalAlert(err.message || 'Falha de comunicação ao carregar a agenda.', 'danger');
      });
  }

  /* -------------------- Ações do Modo Demonstração Local -------------------- */

  function callDemoAction(action, body) {
    return fetch('/api/demo/' + action, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body || {})
    }).then(function (r) { return r.json(); });
  }

  /* -------------------- Bind de Eventos -------------------- */

  function bindEvents() {
    var get = function (id) { return document.getElementById(id); };
    var dialog = get('catalogDialog');
    var busy = false;
    function renderCatalog() {
      var values = state.managed[get('catalogKey').value] || [];
      get('catalogItems').innerHTML = values.map(function (name) {
        return '<li>' + escapeHtml(name) + ' <button type="button" class="btn btn-sm" data-remove="' + escapeHtml(name) + '">Excluir</button></li>';
      }).join('');
    }
    function changeOption(action, name) {
      if (busy || !name.trim()) return;
      busy = true;
      get('catalogStatus').textContent = 'Salvando…';
      callServer('apiChangeOption', { key: get('catalogKey').value, action: action, name: name })
        .then(function (res) {
          if (!res.ok) throw new Error(res.message);
          state.managed[res.key] = res.options;
          get('catalogName').value = '';
          renderCatalog();
          get('catalogStatus').textContent = 'Lista atualizada.';
        }).catch(function (err) { get('catalogStatus').textContent = err.message; })
        .finally(function () { busy = false; });
    }
    get('manageLists').onclick = function () { renderCatalog(); get('catalogStatus').textContent = ''; dialog.showModal(); };
    get('closeCatalog').onclick = function () { dialog.close(); };
    get('catalogKey').onchange = renderCatalog;
    get('catalogForm').onsubmit = function (e) { e.preventDefault(); changeOption('add', get('catalogName').value); };
    get('catalogItems').onclick = function (e) { if (e.target.hasAttribute('data-remove')) changeOption('remove', e.target.dataset.remove); };
    get('newRecord').onclick = function () { openRecordModal(null); get('edit_numeroProcesso').focus(); };
    els.btnRefresh.addEventListener('click', function () {
      loadAgendaData({ silent: false });
    });

    els.btnInitIds.addEventListener('click', function () {
      els.btnInitIds.disabled = true;
      callServer('apiEnsureStableIds')
        .then(function (res) {
          els.btnInitIds.disabled = false;
          if (res && res.ok) {
            showToast('IDs estáveis inicializados para ' + res.createdCount + ' linha(s).', 'success');
            loadAgendaData({ silent: true });
          } else {
            showToast((res && res.message) || 'Não foi possível inicializar IDs.', 'error');
          }
        })
        .catch(function (err) {
          els.btnInitIds.disabled = false;
          showToast(err.message, 'error');
        });
    });

    els.btnPrevDay.addEventListener('click', function () {
      state.referenceDateIso = shiftIsoDate(state.referenceDateIso, -1);
      renderAgenda();
    });

    els.btnToday.addEventListener('click', function () {
      state.referenceDateIso = state.meta.todayIso;
      renderAgenda();
    });

    els.btnNextDay.addEventListener('click', function () {
      state.referenceDateIso = shiftIsoDate(state.referenceDateIso, 1);
      renderAgenda();
    });

    els.referenceDateInput.addEventListener('change', function (e) {
      if (e.target.value) {
        state.referenceDateIso = e.target.value;
        renderAgenda();
      }
    });

    els.tabAttention.addEventListener('click', function () {
      state.scope = 'attention';
      renderAgenda();
    });

    els.tabAll.addEventListener('click', function () {
      state.scope = 'all';
      renderAgenda();
    });

    // Navegação da barra lateral e controle de gráficos
    if (els.navDashboard) {
      els.navDashboard.addEventListener('click', function () {
        state.showAnalytics = true;
        renderAgenda();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    }
    if (els.navAttention) {
      els.navAttention.addEventListener('click', function () {
        state.showAnalytics = false;
        state.scope = 'attention';
        renderAgenda();
        if (els.docketAnchor) els.docketAnchor.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    }
    if (els.navAll) {
      els.navAll.addEventListener('click', function () {
        state.showAnalytics = false;
        state.scope = 'all';
        renderAgenda();
        if (els.docketAnchor) els.docketAnchor.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    }
    if (els.btnToggleAnalytics) {
      els.btnToggleAnalytics.addEventListener('click', function () {
        state.showAnalytics = !state.showAnalytics;
        renderAgenda();
      });
    }

    // Alternador de modo do gráfico temporal (Prazos por dia vs Entradas/Atualizações)
    document.querySelectorAll('[data-timeline-mode]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        state.timelineMode = btn.getAttribute('data-timeline-mode') || 'prazos';
        document.querySelectorAll('[data-timeline-mode]').forEach(function (b) {
          b.classList.toggle('active', b === btn);
        });
        renderTimelineChart(state.records.filter(isCompleteRecord), state.referenceDateIso || state.meta.todayIso, true);
      });
    });

    // Clique interativo nos gráficos para filtrar a carteira
    if (els.analyticsSection) {
      els.analyticsSection.addEventListener('click', function (e) {
        var dateBar = e.target.closest('[data-chart-date]');
        if (dateBar) {
          var targetDate = dateBar.getAttribute('data-chart-date');
          if (targetDate) {
            state.referenceDateIso = targetDate;
            state.scope = 'attention';
            renderAgenda();
            showToast('Data consultada alterada para ' + formatShortBr(targetDate) + '.', 'info');
          }
          return;
        }
        var respBtn = e.target.closest('[data-chart-resp]');
        if (respBtn) {
          var resp = respBtn.getAttribute('data-chart-resp');
          state.filters.responsavel = normalizeText(state.filters.responsavel) === normalizeText(resp) ? '' : resp;
          state.scope = 'all';
          populateAllFilterSelects();
          renderAgenda();
          return;
        }
        var protoBtn = e.target.closest('[data-chart-proto]');
        if (protoBtn) {
          var proto = protoBtn.getAttribute('data-chart-proto');
          state.filters.protocolado = normalizeText(state.filters.protocolado) === normalizeText(proto) ? '' : proto;
          state.scope = 'all';
          populateAllFilterSelects();
          renderAgenda();
          return;
        }
        var prioBtn = e.target.closest('[data-chart-prio]');
        if (prioBtn) {
          var prio = prioBtn.getAttribute('data-chart-prio');
          state.filters.priorizacao = normalizeText(state.filters.priorizacao) === normalizeText(prio) ? '' : prio;
          state.scope = 'all';
          populateAllFilterSelects();
          renderAgenda();
          return;
        }
        var tribBtn = e.target.closest('[data-chart-tribunal]');
        if (tribBtn) {
          var trib = tribBtn.getAttribute('data-chart-tribunal');
          state.filters.tribunal = normalizeText(state.filters.tribunal) === normalizeText(trib) ? '' : trib;
          state.scope = 'all';
          populateAllFilterSelects();
          renderAgenda();
        }
      });
    }

    els.searchInput.addEventListener('input', function (e) {
      state.filters.search = e.target.value || '';
      renderAgenda();
    });

    [
      ['filterResponsavel', 'responsavel'],
      ['filterTribunal', 'tribunal'],
      ['filterPriorizacao', 'priorizacao'],
      ['filterTipo', 'tipo'],
      ['filterProtocolado', 'protocolado']
    ].forEach(function (pair) {
      els[pair[0]].addEventListener('change', function (e) {
        state.filters[pair[1]] = e.target.value || '';
        renderAgenda();
      });
    });

    els.btnClearFilters.addEventListener('click', function () {
      state.filters = {
        search: '',
        responsavel: '',
        tribunal: '',
        priorizacao: '',
        tipo: '',
        protocolado: ''
      };
      els.searchInput.value = '';
      populateAllFilterSelects();
      renderAgenda();
    });

    els.agendaTableBody.addEventListener('click', function (e) {
      var btn = e.target.closest('[data-open-key]');
      var row = e.target.closest('tr[data-record-key]');
      var key = (btn && btn.getAttribute('data-open-key')) || (row && row.getAttribute('data-record-key'));
      if (!key) return;
      var toggleProtBtn = e.target.closest('[data-toggle-protocolado]');
      if (toggleProtBtn && state.userAccess.canEdit) {
        if (toggleProtBtn.disabled || state.isSaving) return;
        var targetRec = state.records.find(function (r) { return recordKey(r) === key; });
        if (!targetRec) return;
        var nextProtVal = toggleProtBtn.getAttribute('data-toggle-protocolado');
        toggleProtBtn.disabled = true;
        toggleProtBtn.classList.add('is-saving');
        state.isSaving = true;

        callServer('apiSaveRecord', {
          recordId: targetRec.id,
          tempRowKey: targetRec.tempRowKey,
          expectedVersion: targetRec.version,
          changes: { protocolado: nextProtVal }
        }).then(function (res) {
          state.isSaving = false;
          if (res && res.ok && res.record) {
            var saved = res.record;
            for (var idx = 0; idx < state.records.length; idx++) {
              var cur = state.records[idx];
              if ((saved.id && cur.id === saved.id) || (targetRec.tempRowKey && cur.tempRowKey === targetRec.tempRowKey)) {
                state.records[idx] = saved;
                break;
              }
            }
            state.animateChartsNext = true;
            renderAgenda();
            loadAgendaData({ silent: true });
            showToast('Protocolado atualizado para "' + nextProtVal + '" (' + (saved.numeroProcesso || 'registro') + ').', 'success');
            return;
          }
          toggleProtBtn.disabled = false;
          toggleProtBtn.classList.remove('is-saving');
          if (res && res.code === 'CONFLICT') {
            openRecordModal(key);
            showConflictState(res);
            return;
          }
          showToast((res && res.message) || 'Não foi possível atualizar o campo Protocolado.', 'error');
        }).catch(function (err) {
          state.isSaving = false;
          toggleProtBtn.disabled = false;
          toggleProtBtn.classList.remove('is-saving');
          showToast(err.message || 'Erro ao atualizar Protocolado.', 'error');
        });
        return;
      }
      var cell = e.target.closest('.col-passos');
      if (cell && state.userAccess.canEdit) {
        if (e.target.closest('[data-steps]')) {
          var record = state.records.find(function (r) { return recordKey(r) === key; });
          cell.innerHTML = '<textarea aria-label="Próximos passos"></textarea><button class="btn btn-sm" data-review-steps>Revisar</button> <button class="btn btn-sm" data-cancel-steps>Cancelar</button>';
          var input = cell.querySelector('textarea');
          input.value = record.proximosPassos || '';
          input.focus();
          return;
        }
        if (e.target.closest('[data-review-steps]')) {
          var draft = cell.querySelector('textarea').value;
          openRecordModal(key);
          els.editProximosPassos.value = draft;
          onEditFormChanged();
          showPreSaveConfirmation();
          return;
        }
        if (e.target.closest('[data-cancel-steps]')) { renderAgenda(); return; }
        if (e.target.closest('textarea')) return;
      }
      openRecordModal(key);
    });

    els.btnCloseModal.addEventListener('click', closeRecordModal);
    els.btnCloseModalFooter.addEventListener('click', closeRecordModal);
    els.modalBackdrop.addEventListener('click', function (e) {
      if (e.target === els.modalBackdrop) closeRecordModal();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !els.modalBackdrop.classList.contains('hidden')) {
        closeRecordModal();
      }
    });

    EDITABLE_FIELDS.forEach(function (field) {
      var inputEl = document.getElementById(field.elId);
      if (inputEl) {
        inputEl.addEventListener('input', onEditFormChanged);
        inputEl.addEventListener('change', onEditFormChanged);
      }
    });

    els.btnReviewSave.addEventListener('click', showPreSaveConfirmation);
    els.btnCancelConfirm.addEventListener('click', function () {
      els.confirmSavePanel.classList.add('hidden');
    });
    els.btnExecuteSave.addEventListener('click', executeConfirmedSave);

    els.btnReloadAfterConflict.addEventListener('click', function () {
      var currentKey = state.selectedRecordKey;
      loadAgendaData({ silent: true, reopenKey: currentKey });
    });

    // Controles exclusivos do modo demo local
    els.demoProfileSelect.addEventListener('change', function (e) {
      callDemoAction('set-role', { role: e.target.value }).then(function () {
        closeRecordModal();
        loadAgendaData({ silent: true });
        showToast('Perfil simulado alterado para: ' + (e.target.value === 'EDITOR' ? 'Editor' : 'Somente leitura'), 'info');
      });
    });

    els.btnDemoReorder.addEventListener('click', function () {
      callDemoAction('reorder').then(function (res) {
        showToast(res.message || 'Linhas da planilha reordenadas.', 'info');
      });
    });

    els.btnDemoSimulateColleague.addEventListener('click', function () {
      var targetId = (state.selectedRecord && state.selectedRecord.id) || (state.records[0] && state.records[0].id);
      callDemoAction('simulate-colleague-edit', { recordId: targetId }).then(function (res) {
        showToast(res.message || 'Edição simultânea de colega simulada na planilha.', 'warn');
      });
    });

    els.btnDemoReset.addEventListener('click', function () {
      callDemoAction('reset').then(function () {
        closeRecordModal();
        loadAgendaData({ silent: true });
        showToast('Dados fictícios de demonstração restaurados.', 'success');
      });
    });
  }

  bindEvents();
  if (window.agendaPages) {
    window.agendaPages.start(loadAgendaData);
  } else {
    loadAgendaData({ silent: false });
  }
})();
</script>
