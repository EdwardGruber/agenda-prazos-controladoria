<style>
  :root {
    /* Paleta do LB Hub (apps/hub: tailwind.config.mjs, styles/global.css e a casca do index.astro):
       fundo cinza claro, cartões brancos, texto e ações em navy, dourado #93784a só como destaque. */
    --bg-canvas: #f5f5f7;
    --bg-surface: #ffffff;
    --bg-subtle: #fafbfc;
    --bg-muted: #eceef0;
    --ink-black: #1c3f53;     /* navy do hub: botões principais, abas ativas e selos escuros */
    --ink-dark: #15303f;
    --ink-charcoal: #2a5670;  /* navy claro: hover dos botões principais */

    --brand: #93784a;         /* dourado do hub */
    --brand-hover: #7d6640;
    --brand-deep: #7d6640;    /* dourado escuro: texto dourado sobre fundo claro (5,46:1 sobre branco) */
    --brand-soft: #f8f6f2;
    --brand-tint: rgba(147, 120, 74, 0.12);
    --brand-border: #ddd2bf;
    --accent-ring: rgba(147, 120, 74, 0.18);
    --accent-bg: rgba(147, 120, 74, 0.06);

    --border: #e4e6ea;
    --border-light: rgba(47, 58, 68, 0.06);
    --border-strong: #d5d7dc;
    --text-primary: #1d1d1f;
    --text-secondary: #5c6670;
    --text-muted: #646c75;    /* 5,32:1 sobre branco, igual ao hub (VIS-02) */
    --text: #1d1d1f;
    --navy: #1c3f53;

    /* Cores de estado do hub */
    --danger-bg: #fef2f2;
    --danger-text: #b42318;
    --danger-border: rgba(239, 68, 68, 0.25);

    --warn-bg: #fffbeb;
    --warn-text: #92400e;
    --warn-border: rgba(245, 158, 11, 0.3);

    --info-bg: #f4f5f6;
    --info-text: #2f3a44;
    --info-border: #d5d7dc;

    --ok-bg: #f0fdf4;
    --ok-text: #166534;
    --ok-border: rgba(34, 197, 94, 0.25);

    --neutral-bg: #f4f5f6;
    --neutral-text: #5c6670;
    --neutral-border: #e4e6ea;

    --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.04);
    --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04), 0 4px 16px rgba(0, 0, 0, 0.04);
    --shadow-md: 0 16px 40px rgba(0, 0, 0, 0.12);
    --radius-xl: 16px;
    --radius-lg: 14px;
    --radius: 10px;
    --radius-sm: 8px;

    --sidebar-w: 240px;
    --font-sans: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-display: var(--font-sans);
    --font-mono: var(--font-sans);
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg-canvas);
    color: var(--text-primary);
    font-family: var(--font-sans);
    font-size: 13.5px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  /* Foco visível no dourado, como no hub */
  button:focus-visible,
  [role="tab"]:focus-visible,
  a:focus-visible {
    outline: 2px solid var(--brand);
    outline-offset: 2px;
  }

  .app-shell, #loginPanel, .demo-banner {
    position: relative;
    z-index: 2;
  }

  @keyframes editorialReveal {
    from {
      opacity: 0;
      transform: translateY(10px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes drawerSlideIn {
    from {
      opacity: 0.4;
      transform: translateX(28px);
    }
    to {
      opacity: 1;
      transform: translateX(0);
    }
  }

  /* Como no hub (VIS-03): animação só onde comunica estado. Os blocos da página entram sem deslizar. */
  @media (prefers-reduced-motion: reduce) {
    .modal-drawer {
      animation: none !important;
    }
  }

  .hidden {
    display: none !important;
  }

  /* ==================== Tela de Login (GitHub Pages / PWA) ==================== */
  #loginPanel {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--bg-canvas);
  }

  #loginPanel[hidden] {
    display: none !important;
  }

  .login-card {
    width: 100%;
    max-width: 460px;
    background: var(--bg-surface);
    border: 1px solid var(--border-light);
    border-radius: var(--radius-lg);
    padding: 40px 36px 32px;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
  }

  .login-kicker {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 22px;
  }

  .login-emblem {
    width: 44px;
    height: 44px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--navy) 0%, var(--ink-dark) 100%);
    color: #ffffff;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 0.04em;
    flex-shrink: 0;
  }

  .login-eyebrow {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
  }

  .login-card h1 {
    margin: 0 0 10px;
    font-size: 1.75rem;
    font-weight: 800;
    line-height: 1.15;
    letter-spacing: -0.5px;
    color: var(--navy);
  }

  .login-card h1 em {
    font-style: normal;
    color: var(--brand-deep);
  }

  #loginMessage {
    margin: 0 0 24px;
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.55;
  }

  #loginButton {
    width: 100%;
    padding: 13px 18px;
    font-size: 14px;
    border-radius: var(--radius);
  }

  .login-footnote {
    margin: 20px 0 0;
    padding-top: 14px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--text-muted);
  }

  /* ==================== Banner de Demonstração Local ==================== */
  /* Faixa âmbar, como a .hint-box do hub: aviso visível, sem competir com a casca */
  .demo-banner {
    background: #fffbeb;
    color: #92400e;
    padding: 8px 20px;
    border-bottom: 1px solid rgba(245, 158, 11, 0.3);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-size: 12px;
  }

  .demo-banner-info {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .demo-pill {
    background: #92400e;
    color: #ffffff;
    font-weight: 700;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 3px 9px;
    border-radius: 999px;
  }

  .demo-controls {
    display: flex;
    align-items: center;
    gap: 7px;
    flex-wrap: wrap;
  }

  .demo-controls label {
    color: #92400e;
    font-size: 11.5px;
  }

  .demo-controls select,
  .demo-controls button {
    font-size: 11.5px;
    padding: 4px 9px;
    border-radius: 6px;
    border: 1px solid rgba(146, 64, 14, 0.25);
    background: #ffffff;
    color: #78350f;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s ease, border-color 0.15s ease;
  }

  .demo-controls select option {
    color: #111111;
    background: #ffffff;
  }

  .demo-controls button:hover,
  .demo-controls select:hover {
    background: #fef3c7;
    border-color: rgba(146, 64, 14, 0.45);
  }

  /* ==================== App Shell: Sidebar + Main Workspace ==================== */
  .app-shell {
    display: flex;
    min-height: 100vh;
  }

  /* Menu lateral claro do LB Hub (casca do index.astro): marca no topo, grupos com rótulo em caixa alta,
     item ativo com fundo dourado-claro, borda dourada à esquerda e ícone num quadrado dourado. */
  .sidebar {
    width: var(--sidebar-w);
    flex-shrink: 0;
    background: var(--bg-surface);
    color: var(--text-primary);
    border-right: 1px solid var(--border-strong);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
  }

  .sidebar-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 18px 16px;
    border-bottom: 1px solid var(--border-light);
  }

  .brand-emblem {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--navy) 0%, var(--ink-dark) 100%);
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.04em;
    flex-shrink: 0;
  }

  .sidebar-title {
    margin: 0;
    font-size: 14px;
    font-weight: 700;
    color: var(--text-primary);
    line-height: 1.2;
  }

  .sidebar-sub {
    font-size: 11px;
    color: var(--text-muted);
  }

  .sidebar-nav {
    padding: 12px 8px 20px;
  }

  .nav-group-label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    padding: 0 8px 6px;
  }

  .nav-group-label svg {
    width: 13px;
    height: 13px;
    flex-shrink: 0;
  }

  .nav-item {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 10px;
    margin-bottom: 2px;
    border: 1px solid transparent;
    border-radius: 8px;
    background: transparent;
    font: inherit;
    color: inherit;
    text-align: left;
    cursor: pointer;
    transition: background-color 0.15s, border-color 0.15s;
  }

  .nav-item:hover {
    background: var(--bg-subtle);
  }

  .nav-item.active {
    background: var(--accent-bg);
    border-color: var(--accent-ring);
    border-left: 3px solid var(--brand);
  }

  .nav-icon {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    background: var(--bg-canvas);
    color: var(--text-secondary);
    transition: background-color 0.15s, color 0.15s;
  }

  .nav-icon svg {
    width: 16px;
    height: 16px;
  }

  .nav-item.active .nav-icon {
    background: var(--brand);
    color: #ffffff;
  }

  .nav-label {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    line-height: 1.3;
  }

  .nav-item.active .nav-label {
    color: var(--text-primary);
    font-weight: 600;
  }

  /* Contadores do menu: o de "Atenção do dia" é o vermelho do hub (.nav-count); o geral é neutro */
  .nav-pill {
    margin-left: auto;
    flex-shrink: 0;
    min-width: 20px;
    height: 20px;
    padding: 0 6px;
    border-radius: 999px;
    background: var(--bg-muted);
    color: var(--text-secondary);
    font-size: 11px;
    font-weight: 700;
    display: inline-grid;
    place-items: center;
    font-variant-numeric: tabular-nums;
  }

  .nav-pill.nav-pill-alert {
    background: #c81e1e;
    color: #ffffff;
  }

  .sidebar-footer {
    padding: 12px 12px 14px;
    border-top: 1px solid var(--border-light);
  }

  .sidebar-meta-card {
    font-size: 11px;
    color: var(--text-muted);
    display: flex;
    flex-direction: column;
    gap: 3px;
    line-height: 1.4;
  }

  .sidebar-meta-card strong {
    color: var(--text-secondary);
    font-weight: 600;
  }

  .workspace-main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }

  /* ==================== Cabeçalho da página (.tool-header do hub) ==================== */
  .topbar {
    background: transparent;
  }

  .topbar-inner {
    max-width: 1460px;
    margin: 0 auto;
    padding: 32px 40px 4px;
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 14px;
  }

  .topbar-heading {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .topbar-heading h1 {
    margin: 0;
    font-size: 1.75rem;
    font-weight: 800;
    line-height: 1.15;
    letter-spacing: -0.5px;
    color: var(--navy);
  }

  .topbar-subline {
    font-size: 14px;
    color: var(--text-muted);
    letter-spacing: 0.01em;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .topbar-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .access-badge {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    border: 1px solid var(--border);
    background: var(--bg-subtle);
    color: var(--text-primary);
  }

  .access-badge::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .access-badge.editor {
    background: var(--brand-soft);
    border-color: var(--brand-border);
    color: var(--brand-deep);
  }

  .access-badge.editor::before {
    background: var(--brand-deep);
  }

  .access-badge.viewer {
    background: #f4f4f5;
    border-color: #d4d4d8;
    color: #52525b;
  }

  .access-badge.viewer::before {
    background: #71717a;
  }

  /* ==================== Botões ==================== */
  /* Secundário: contorno cinza, como os botões e chips do hub. Principal: navy (.btn-submit do hub). */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 8px 14px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    border: 1px solid var(--border-strong);
    background: var(--bg-surface);
    color: var(--text-primary);
    cursor: pointer;
    transition: background-color 0.15s, border-color 0.15s, color 0.15s;
    white-space: nowrap;
  }

  .btn:hover:not(:disabled) {
    background: var(--bg-subtle);
    border-color: var(--navy);
  }

  .btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .btn-primary {
    background: var(--navy);
    border-color: var(--navy);
    color: #ffffff;
  }

  .btn-primary:hover:not(:disabled) {
    background: var(--ink-charcoal);
    border-color: var(--ink-charcoal);
  }

  .btn-primary:active:not(:disabled) {
    transform: scale(0.98);
  }

  .btn-topbar {
    background: var(--bg-surface);
    border-color: var(--border-strong);
    color: var(--text-primary);
  }

  .btn-topbar:hover:not(:disabled) {
    background: var(--bg-subtle);
    border-color: var(--navy);
  }

  #newRecord.btn-topbar {
    background: var(--navy);
    border-color: var(--navy);
    color: #ffffff;
    border-radius: 10px;
    padding: 9px 16px;
  }

  #newRecord.btn-topbar:hover:not(:disabled) {
    background: var(--ink-charcoal);
    border-color: var(--ink-charcoal);
  }

  .btn-warn {
    background: var(--brand-deep);
    border-color: var(--brand-deep);
    color: #ffffff;
  }

  .btn-warn:hover:not(:disabled) {
    background: #66532f;
  }

  .btn-sm {
    padding: 5px 11px;
    font-size: 12px;
  }

  .btn-ghost-dark {
    background: rgba(255, 255, 255, 0.1);
    border-color: rgba(255, 255, 255, 0.3);
    color: #ffffff;
  }

  .btn-ghost-dark:hover:not(:disabled) {
    background: rgba(255, 255, 255, 0.18);
    border-color: #ffffff;
  }

  .btn-link {
    background: transparent;
    border: none;
    color: var(--navy);
    padding: 2px 4px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 2px;
    font-family: inherit;
    font-size: inherit;
  }

  /* ==================== Conteúdo Principal ==================== */
  .container {
    max-width: 1460px;
    width: 100%;
    margin: 0 auto;
    padding: 24px 40px 48px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* ==================== Alertas ==================== */
  .alert {
    padding: 12px 16px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  .alert-info { background: var(--brand-soft); color: var(--text-primary); border-color: var(--brand-border); }
  .alert-warn { background: var(--warn-bg); color: var(--warn-text); border-color: var(--warn-border); }
  .alert-danger { background: var(--danger-bg); color: var(--danger-text); border-color: var(--danger-border); }
  .alert-success { background: var(--ok-bg); color: var(--ok-text); border-color: var(--ok-border); }

  /* ==================== Barra de Data e Escopo ==================== */
  .date-toolbar {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 14px 20px;
    box-shadow: var(--shadow-xs);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
  }

  .date-nav {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .date-label-block {
    margin-right: 10px;
    padding-right: 16px;
    border-right: 1px solid var(--border);
  }

  .date-label-caption {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--brand-deep);
    display: block;
  }

  .date-label-value {
    font-size: 16px;
    font-weight: 700;
    color: var(--text-primary);
    letter-spacing: -0.015em;
    font-variant-numeric: tabular-nums;
  }

  .date-input {
    padding: 5px 10px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    font-family: inherit;
    font-size: 12.5px;
    color: var(--text-primary);
    background: var(--bg-subtle);
  }

  .date-input:focus {
    outline: none;
    border-color: var(--brand-deep);
    box-shadow: 0 0 0 3px rgba(147, 120, 74, 0.25);
  }

  .toolbar-right {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .scope-tabs {
    display: inline-flex;
    gap: 6px;
  }

  .scope-tab {
    border: none;
    background: transparent;
    border: 1px solid var(--border-strong);
    padding: 6px 14px;
    border-radius: 999px;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-secondary);
    cursor: pointer;
    transition: background-color 0.15s, border-color 0.15s, color 0.15s;
  }

  .scope-tab:hover {
    border-color: var(--navy);
    color: var(--text-primary);
  }

  .scope-tab.active {
    background: var(--navy);
    border-color: var(--navy);
    color: #ffffff;
  }

  /* ==================== KPI Hero Bento Assimétrico ==================== */
  .kpi-grid {
    display: grid;
    grid-template-columns: 1.55fr 1fr 1fr 1fr;
    gap: 14px;
  }

  .kpi-card {
    background: var(--bg-surface);
    border: 1px solid var(--border-light);
    border-radius: var(--radius-lg);
    padding: 18px 20px;
    box-shadow: var(--shadow-sm);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 10px;
    transition: box-shadow 0.2s ease, border-color 0.2s ease;
  }

  .kpi-card:hover {
    border-color: rgba(0, 0, 0, 0.1);
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
  }

  /* Cartão destaque (pendentes): bento claro com a faixa dourada do item ativo do hub */
  .kpi-card.pending {
    position: relative;
    overflow: hidden;
    isolation: isolate;
    background: var(--bg-surface);
    border-color: var(--accent-ring);
    border-left: 3px solid var(--brand);
  }

  .kpi-card.pending > * {
    position: relative;
    z-index: 1;
  }

  .kpi-card.pending > .heroi-faisca {
    position: absolute;
    z-index: 0;
    top: 10px;
    right: 0;
    width: 66%;
    height: 112px;
    opacity: 0.55;
    pointer-events: none;
    -webkit-mask-image: linear-gradient(to right, transparent, #000 38%);
    mask-image: linear-gradient(to right, transparent, #000 38%);
  }

  .heroi-faisca svg {
    display: block;
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  .kpi-card.pending .kpi-value {
    font-size: 48px;
  }
  .kpi-card.pending .kpi-sub { border-top: 1px solid var(--border-light); padding-top: 8px; }
  .kpi-card.pending .kpi-icon {
    background: var(--brand);
    color: #ffffff;
    border-color: var(--brand);
  }

  .kpi-index {
    display: block;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 3px;
  }

  .kpi-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
  }

  .kpi-icon {
    width: 34px;
    height: 34px;
    border-radius: 9px;
    background: var(--brand-soft);
    border: 1px solid var(--brand-border);
    color: var(--brand-deep);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .kpi-card.fatal .kpi-icon {
    background: var(--danger-bg);
    border-color: var(--danger-border);
    color: var(--danger-text);
  }

  .kpi-card.juntada .kpi-icon {
    background: var(--navy);
    border-color: var(--navy);
    color: #ffffff;
  }

  .kpi-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-primary);
    letter-spacing: -0.01em;
  }

  .kpi-value {
    font-size: 40px;
    line-height: 1;
    font-weight: 800;
    color: var(--navy);
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
    margin: 2px 0;
  }

  .kpi-sub {
    font-size: 11.5px;
    color: var(--text-muted);
    line-height: 1.4;
  }

  /* ==================== Seção de Gráficos Analíticos ==================== */
  .analytics-section {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .analytics-row-top {
    display: grid;
    grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr);
    gap: 14px;
  }

  .analytics-row-bottom {
    display: grid;
    grid-template-columns: 1.15fr 1fr 1fr;
    gap: 14px;
  }

  .chart-card {
    background: var(--bg-surface);
    border: 1px solid var(--border-light);
    border-radius: var(--radius-lg);
    padding: 20px 22px;
    box-shadow: var(--shadow-sm);
    display: flex;
    flex-direction: column;
    gap: 14px;
    transition: border-color 0.25s ease, box-shadow 0.25s ease;
  }

  .chart-card:hover {
    border-color: rgba(0, 0, 0, 0.1);
  }

  /* O antigo painel escuro do fluxo de prazos agora é um bento claro, como os demais */
  .chart-card-dark > * {
    position: relative;
    z-index: 1;
  }

  .chart-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border-light);
  }

  .chart-title {
    margin: 0;
    font-size: 14px;
    font-weight: 600;
    line-height: 1.3;
    color: var(--text-primary);
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }

  .chart-title::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--brand);
    flex-shrink: 0;
  }

  /* Animações Neon dos Gráficos SVG (inspiradas em controle-de-gastos) */
  @keyframes neonBarGrow {
    from { transform: scaleY(0); opacity: 0.2; }
    to { transform: scaleY(1); opacity: 1; }
  }

  @keyframes neonLineDraw {
    from { stroke-dashoffset: 1; }
    to { stroke-dashoffset: 0; }
  }

  @keyframes neonFadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @keyframes neonHaloPulse {
    0% { transform: scale(0.6); opacity: 0.55; }
    70%, 100% { transform: scale(1.75); opacity: 0; }
  }

  @keyframes neonBarFillX {
    from { transform: scaleX(0); }
    to { transform: scaleX(1); }
  }

  @keyframes neonDonutSweep {
    from { opacity: 0; transform: rotate(-115deg) scale(0.92); }
    to { opacity: 1; transform: rotate(0deg) scale(1); }
  }

  .timeline-bar-anim {
    transform-box: fill-box;
    transform-origin: bottom;
    animation: neonBarGrow 0.65s cubic-bezier(0.2, 0.85, 0.25, 1) var(--bar-delay, 0ms) both;
  }

  .neon-draw {
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
    animation: neonLineDraw 1.15s cubic-bezier(0.35, 0, 0.2, 1) 0.18s forwards;
  }

  .neon-surge {
    animation: neonFadeIn 0.7s ease var(--surge-delay, 0.35s) both;
  }

  .neon-beacon .neon-halo {
    transform-box: fill-box;
    transform-origin: center;
    animation: neonHaloPulse 2.4s ease-out infinite;
  }

  .donut-svg-anim {
    transform-origin: center;
    animation: neonDonutSweep 0.75s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  .chart-sub {
    margin: 2px 0 0;
    font-size: 12px;
    color: var(--text-muted);
  }

  .chart-switcher {
    display: inline-flex;
    background: var(--bg-muted);
    border-radius: 8px;
    padding: 3px;
    gap: 2px;
  }

  .chart-switch-btn {
    border: none;
    background: transparent;
    padding: 4px 10px;
    border-radius: 6px;
    font-family: inherit;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--text-secondary);
    cursor: pointer;
  }

  .chart-switch-btn.active {
    background: var(--navy);
    color: #ffffff;
  }

  .chart-badge-pill {
    font-size: 11px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--brand-soft);
    color: var(--brand-deep);
    border: 1px solid var(--brand-border);
    white-space: nowrap;
  }

  /* Timeline SVG Chart */
  .timeline-svg-wrap {
    width: 100%;
    overflow-x: auto;
  }

  .timeline-svg {
    width: 100%;
    min-width: 460px;
    height: 210px;
    display: block;
  }

  .timeline-bar-group {
    cursor: pointer;
  }

  .timeline-bar-group:hover .timeline-bar {
    opacity: 0.85;
  }

  .chart-legend-inline {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    font-size: 11.5px;
    color: var(--text-muted);
  }

  .legend-dot {
    display: inline-block;
    width: 9px;
    height: 9px;
    border-radius: 3px;
    margin-right: 5px;
    vertical-align: middle;
  }

  /* Ranking de Responsáveis */
  .rank-list {
    display: flex;
    flex-direction: column;
    gap: 11px;
  }

  .rank-row {
    border: 1px solid transparent;
    background: transparent;
    width: 100%;
    text-align: left;
    padding: 7px 9px;
    margin: -3px -9px;
    border-radius: 10px;
    cursor: pointer;
    font-family: inherit;
    display: flex;
    flex-direction: column;
    gap: 6px;
    transition: background 0.14s ease, border-color 0.14s ease;
  }

  .rank-row:hover {
    background: var(--bg-subtle);
    border-color: var(--border);
  }

  .rank-row.is-active-filter {
    background: var(--brand-soft);
    border-color: var(--brand);
  }

  .rank-row-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .rank-person {
    display: flex;
    align-items: center;
    gap: 9px;
    min-width: 0;
  }

  .rank-ordinal {
    font-family: var(--font-mono);
    font-size: 10.5px;
    font-weight: 600;
    color: var(--text-muted);
    width: 18px;
    flex-shrink: 0;
  }

  .avatar-chip {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--bg-muted);
    color: var(--ink-black);
    border: 1px solid var(--border-strong);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.03em;
    flex-shrink: 0;
  }

  .avatar-chip.top-leader {
    background: var(--brand);
    color: #ffffff;
    border-color: var(--brand);
  }

  .rank-name {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-primary);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .rank-crown {
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 999px;
    background: var(--brand-hover);
    color: #ffffff;
    flex-shrink: 0;
  }

  .rank-counts {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-primary);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .rank-counts small {
    font-weight: 500;
    color: var(--text-muted);
    margin-left: 4px;
  }

  .bar-track {
    width: 100%;
    height: 8px;
    border-radius: 999px;
    background: var(--bg-muted);
    overflow: hidden;
    display: flex;
  }

  .bar-fill-main {
    height: 100%;
    background: var(--navy);
    border-radius: 999px;
    transform-origin: left;
    transition: width 0.45s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .bar-fill-brand {
    height: 100%;
    background: var(--brand);
    border-radius: 999px;
    transform-origin: left;
    transition: width 0.45s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .bar-fill-danger {
    height: 100%;
    background: var(--danger-text);
    border-radius: 999px;
    transform-origin: left;
    transition: width 0.45s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .bar-anim-x {
    animation: neonBarFillX 0.72s cubic-bezier(0.2, 0.85, 0.25, 1) var(--bar-delay, 0ms) both;
  }

  /* Donut de Protocolo */
  .donut-layout {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    flex: 1;
  }

  .donut-wrap {
    position: relative;
    width: 138px;
    height: 138px;
    flex-shrink: 0;
  }

  .donut-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  .donut-pct {
    font-size: 28px;
    font-weight: 800;
    color: var(--navy);
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }

  .donut-pct-label {
    font-size: 8.5px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-top: 3px;
  }

  .donut-legend {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .legend-btn {
    border: 1px solid var(--border);
    background: var(--bg-subtle);
    border-radius: 10px;
    padding: 9px 12px;
    cursor: pointer;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    transition: border-color 0.14s ease, background 0.14s ease;
  }

  .legend-btn:hover,
  .legend-btn.is-active-filter {
    background: var(--brand-soft);
    border-color: var(--brand);
  }

  .legend-btn-left {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-primary);
  }

  .legend-btn-val {
    font-size: 14px;
    font-weight: 700;
    color: var(--text-primary);
    font-variant-numeric: tabular-nums;
  }

  /* Distribuições compactas (Priorização e Tribunais) */
  .mini-bars {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .mini-bar-btn {
    border: 1px solid transparent;
    background: transparent;
    width: 100%;
    padding: 6px 8px;
    margin: -3px -8px;
    border-radius: 9px;
    cursor: pointer;
    font-family: inherit;
    text-align: left;
    display: flex;
    flex-direction: column;
    gap: 5px;
    transition: background 0.12s ease, border-color 0.12s ease;
  }

  .mini-bar-btn:hover {
    background: var(--bg-subtle);
    border-color: var(--border);
  }

  .mini-bar-btn.is-active-filter {
    background: var(--brand-soft);
    border-color: var(--brand);
  }

  .mini-bar-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-primary);
  }

  .mini-bar-top span:last-child {
    font-variant-numeric: tabular-nums;
    color: var(--text-secondary);
  }

  /* ==================== Busca e Filtros ==================== */
  .control-card {
    background: var(--bg-surface);
    border: 1px solid var(--border-light);
    border-radius: var(--radius-lg);
    padding: 18px 20px;
    box-shadow: var(--shadow-sm);
  }

  .docket-section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }

  .docket-section-title {
    margin: 0;
    font-size: 17px;
    font-weight: 700;
    color: var(--navy);
  }

  .filters-top-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px;
    align-items: end;
    margin-bottom: 12px;
  }

  .search-input-wrap {
    position: relative;
  }

  .search-input-wrap svg {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    width: 15px;
    height: 15px;
    color: var(--text-muted);
    pointer-events: none;
  }

  .search-input-wrap input {
    padding-left: 36px !important;
  }

  .filters-grid {
    display: grid;
    grid-template-columns: repeat(5, minmax(130px, 1fr));
    gap: 10px;
    align-items: end;
  }

  .field-group label {
    display: block;
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    margin-bottom: 5px;
  }

  .field-group input,
  .field-group select,
  .field-group textarea {
    width: 100%;
    padding: 9px 12px;
    border: 1.5px solid rgba(0, 0, 0, 0.15);
    border-radius: var(--radius-sm);
    font-family: inherit;
    font-size: 13px;
    color: var(--text-primary);
    background: var(--bg-surface);
    transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
  }

  .field-group input:focus,
  .field-group select:focus,
  .field-group textarea:focus {
    outline: none;
    background: #ffffff;
    border-color: var(--brand);
    box-shadow: 0 0 0 3px var(--accent-ring);
  }

  .field-group input:disabled,
  .field-group select:disabled,
  .field-group textarea:disabled {
    background: var(--bg-muted);
    color: var(--text-muted);
    cursor: not-allowed;
  }

  .filters-footer {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    font-size: 12px;
    color: var(--text-muted);
  }

  /* ==================== Lista Executiva (Sem cara de Excel) ==================== */
  .table-card {
    background: var(--bg-surface);
    border: 1px solid var(--border-light);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
  }

  .table-scroll {
    overflow-x: auto;
  }

  table.agenda-table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
    min-width: 980px;
  }

  table.agenda-table thead th {
    background: var(--bg-muted);
    color: var(--text-muted);
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    text-align: left;
    padding: 12px 7px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }

  table.agenda-table thead th:nth-child(1) { width: 10.4%; }
  table.agenda-table thead th:nth-child(2) { width: 7.4%; }
  table.agenda-table thead th:nth-child(3) { width: 7.4%; }
  table.agenda-table thead th:nth-child(4) { width: 15.2%; }
  table.agenda-table thead th:nth-child(5) { width: 11.4%; }
  table.agenda-table thead th:nth-child(6) { width: 10.6%; }
  table.agenda-table thead th:nth-child(7) { width: 7.6%; }
  table.agenda-table thead th:nth-child(8) { width: 12.6%; }
  table.agenda-table thead th:nth-child(9) { width: 8.2%; }
  table.agenda-table thead th:nth-child(10) { width: 9.2%; }

  table.agenda-table tbody tr {
    border-bottom: 1px solid #eceef0;
    cursor: pointer;
    transition: background 0.16s ease, box-shadow 0.16s ease;
  }

  table.agenda-table tbody tr:last-child {
    border-bottom: none;
  }

  table.agenda-table tbody tr:hover {
    background: var(--bg-subtle);
  }

  /* Prioridade pela faixa à esquerda, com fundo quase branco (tabelas do hub são brancas) */
  table.agenda-table tbody tr.row-pending {
    background: #fffdf7;
  }

  table.agenda-table tbody tr.row-pending td:first-child {
    box-shadow: inset 3px 0 0 #f59e0b;
  }

  table.agenda-table tbody tr.row-prio-urgente {
    background: rgba(180, 35, 24, 0.035);
  }

  table.agenda-table tbody tr.row-prio-urgente td:first-child {
    box-shadow: inset 3px 0 0 #b42318;
  }

  table.agenda-table tbody tr.row-prio-urgente:hover {
    background: rgba(180, 35, 24, 0.06);
  }

  table.agenda-table tbody tr.row-prio-alta td:first-child {
    box-shadow: inset 3px 0 0 var(--navy);
  }

  table.agenda-table tbody tr.row-prio-media td:first-child {
    box-shadow: inset 3px 0 0 var(--brand);
  }

  table.agenda-table tbody tr.row-prio-baixa,
  table.agenda-table tbody tr.row-prio-sem-urgencia {
    background: #ffffff;
  }

  /* Animação de entrada em cascata das linhas + destaque luminoso ao incluir novo processo */
  @keyframes rowCascadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes newRecordPulse {
    0% {
      opacity: 0;
      transform: translateY(-10px) scale(0.99);
      background: rgba(147, 120, 74, 0.48);
      box-shadow: inset 5px 0 0 #93784a, 0 0 24px rgba(147, 120, 74, 0.55);
    }
    35% {
      opacity: 1;
      transform: translateY(0) scale(1);
      background: rgba(147, 120, 74, 0.34);
      box-shadow: inset 5px 0 0 #1c3f53, 0 0 18px rgba(147, 120, 74, 0.45);
    }
    100% {
      opacity: 1;
      transform: translateY(0) scale(1);
      box-shadow: none;
    }
  }

  table.agenda-table tbody tr.row-animate-in {
    animation: rowCascadeIn 0.42s cubic-bezier(0.22, 1, 0.36, 1) var(--row-delay, 0ms) both;
  }

  table.agenda-table tbody tr.row-just-created {
    animation: newRecordPulse 2.2s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  .badge-novo-proc {
    background: var(--brand-hover);
    color: #ffffff;
    border-color: var(--brand-hover);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  table.agenda-table tbody td {
    padding: 12px 8px;
    vertical-align: middle;
    font-size: 12.5px;
    overflow-wrap: break-word;
  }

  .col-date {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    font-weight: 600;
    font-size: 12px;
    color: var(--text-primary);
  }

  .col-date.is-empty { color: #a3a8ae; font-weight: 400; }
  .col-date.is-today { color: #b42318; }
  .col-date.is-past-pending { color: var(--brand-deep); }
  .col-date.is-juntada-today {
    color: var(--ink-black);
    text-decoration: underline;
    text-decoration-color: var(--brand);
    text-decoration-thickness: 2px;
    text-underline-offset: 4px;
  }

  .col-processo {
    overflow: hidden;
  }

  .proc-num {
    font-family: var(--font-mono);
    font-size: 11.5px;
    font-weight: 600;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .proc-sub {
    margin-top: 2px;
    font-size: 11px;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .col-cliente {
    font-weight: 600;
    color: var(--text-primary);
    line-height: 1.35;
  }

  .col-resp {
    overflow: hidden;
  }

  .resp-cell {
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 500;
    color: var(--text-primary);
    min-width: 0;
  }

  .resp-cell span:last-child {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .resp-avatar-sm {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--brand-soft);
    border: 1px solid var(--brand-border);
    color: var(--brand-deep);
    font-size: 9.5px;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .col-passos {
    color: var(--text-secondary);
  }

  .passos-preview {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .steps-edit {
    display: inline-block;
    width: 100%;
    padding: 4px 7px;
    margin: -4px -7px;
    border-radius: 6px;
