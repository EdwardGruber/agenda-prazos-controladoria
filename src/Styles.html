<style>
  :root {
    /* Paleta Executiva: Branco, Preto (#0e0e10) e Champagne (#c0a68d) */
    --bg-canvas: #f5f3ef;
    --bg-surface: #ffffff;
    --bg-subtle: #faf8f5;
    --bg-muted: #f0ece5;
    --ink-black: #0e0e10;
    --ink-dark: #18181b;
    --ink-charcoal: #27272a;

    --brand: #c0a68d;
    --brand-hover: #af9377;
    --brand-deep: #7d644c;
    --brand-soft: #f7f1ea;
    --brand-tint: rgba(192, 166, 141, 0.16);
    --brand-border: #dfd1c2;

    --border: #eae4dc;
    --border-strong: #d8cfc4;
    --text-primary: #121214;
    --text-secondary: #524d47;
    --text-muted: #827b73;
    --text: #121214;

    /* Semântica elegante integrada à paleta */
    --danger-bg: #fdf2f3;
    --danger-text: #8c1d24;
    --danger-border: #ecc1c5;

    --warn-bg: #f8f1e7;
    --warn-text: #7c5321;
    --warn-border: #dec3a5;

    --info-bg: #f4f3f1;
    --info-text: #18181b;
    --info-border: #d7d2cb;

    --ok-bg: #eef6f1;
    --ok-text: #1d5733;
    --ok-border: #bad9c5;

    --neutral-bg: #f4f2ee;
    --neutral-text: #57524c;
    --neutral-border: #dfd9d0;

    --shadow-xs: 0 1px 2px rgba(14, 14, 16, 0.04);
    --shadow-sm: 0 4px 14px rgba(14, 14, 16, 0.05);
    --shadow-md: 0 16px 40px rgba(14, 14, 16, 0.14);
    --radius-xl: 18px;
    --radius-lg: 14px;
    --radius: 10px;
    --radius-sm: 8px;

    --sidebar-w: 224px;
    --font-display: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    --font-sans: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", SFMono-Regular, Consolas, monospace;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    background:
      radial-gradient(ellipse 70% 45% at 88% 0%, rgba(192, 166, 141, 0.14), transparent 62%),
      radial-gradient(ellipse 55% 40% at 15% 100%, rgba(14, 14, 16, 0.035), transparent 60%),
      var(--bg-canvas);
    color: var(--text-primary);
    font-family: var(--font-sans);
    font-size: 13.5px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  /* Textura sutil de papel editorial (materialidade sem poluição visual) */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    opacity: 0.028;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }

  .app-shell, #loginPanel, .demo-banner {
    position: relative;
    z-index: 2;
  }

  @keyframes editorialReveal {
    from {
      opacity: 0;
      transform: translateY(10px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes drawerSlideIn {
    from {
      opacity: 0.4;
      transform: translateX(28px);
    }
    to {
      opacity: 1;
      transform: translateX(0);
    }
  }

  .date-toolbar { animation: editorialReveal 0.45s cubic-bezier(0.22, 1, 0.36, 1) 0.03s both; }
  .kpi-grid { animation: editorialReveal 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0.08s both; }
  .analytics-row-top { animation: editorialReveal 0.55s cubic-bezier(0.22, 1, 0.36, 1) 0.14s both; }
  .analytics-row-bottom { animation: editorialReveal 0.55s cubic-bezier(0.22, 1, 0.36, 1) 0.2s both; }
  .control-card { animation: editorialReveal 0.55s cubic-bezier(0.22, 1, 0.36, 1) 0.24s both; }
  .table-card { animation: editorialReveal 0.55s cubic-bezier(0.22, 1, 0.36, 1) 0.28s both; }

  @media (prefers-reduced-motion: reduce) {
    .date-toolbar, .kpi-grid, .analytics-row-top, .analytics-row-bottom, .control-card, .table-card, .modal-drawer {
      animation: none !important;
    }
  }

  .hidden {
    display: none !important;
  }

  /* ==================== Tela de Login (GitHub Pages / PWA) ==================== */
  #loginPanel {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background:
      radial-gradient(circle at 85% 15%, rgba(192, 166, 141, 0.28), transparent 45%),
      radial-gradient(circle at 12% 88%, rgba(14, 14, 16, 0.07), transparent 45%),
      var(--bg-canvas);
  }

  #loginPanel[hidden] {
    display: none !important;
  }

  .login-card {
    width: 100%;
    max-width: 460px;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-top: 3px solid var(--brand);
    border-radius: 12px;
    padding: 44px 38px 36px;
    box-shadow: 0 24px 60px rgba(14, 14, 16, 0.12);
  }

  .login-kicker {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 22px;
  }

  .login-emblem {
    width: 44px;
    height: 44px;
    border-radius: 9px;
    background: var(--ink-black);
    color: var(--brand);
    border: 1px solid rgba(192, 166, 141, 0.55);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 0.06em;
    flex-shrink: 0;
  }

  .login-eyebrow {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--brand-deep);
  }

  .login-card h1 {
    margin: 0 0 12px;
    font-family: var(--font-display);
    font-size: 38px;
    font-weight: 600;
    line-height: 1.05;
    letter-spacing: -0.02em;
    color: var(--text-primary);
  }

  .login-card h1 em {
    font-style: italic;
    color: var(--brand-deep);
  }

  #loginMessage {
    margin: 0 0 24px;
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.55;
  }

  #loginButton {
    width: 100%;
    padding: 13px 18px;
    font-size: 14px;
    border-radius: var(--radius);
  }

  .login-footnote {
    margin: 20px 0 0;
    padding-top: 14px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--text-muted);
  }

  /* ==================== Banner de Demonstração Local ==================== */
  .demo-banner {
    background: #171615;
    color: #f4f1ec;
    padding: 8px 20px;
    border-bottom: 1px solid rgba(192, 166, 141, 0.35);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-size: 12px;
  }

  .demo-banner-info {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .demo-pill {
    background: var(--brand);
    color: #111111;
    font-weight: 700;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 3px 9px;
    border-radius: 999px;
  }

  .demo-controls {
    display: flex;
    align-items: center;
    gap: 7px;
    flex-wrap: wrap;
  }

  .demo-controls label {
    color: #cfc8be;
    font-size: 11.5px;
  }

  .demo-controls select,
  .demo-controls button {
    font-size: 11.5px;
    padding: 4px 9px;
    border-radius: 6px;
    border: 1px solid rgba(192, 166, 141, 0.4);
    background: rgba(255, 255, 255, 0.06);
    color: #ffffff;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s ease, border-color 0.15s ease;
  }

  .demo-controls select option {
    color: #111111;
    background: #ffffff;
  }

  .demo-controls button:hover,
  .demo-controls select:hover {
    background: rgba(192, 166, 141, 0.22);
    border-color: var(--brand);
  }

  /* ==================== App Shell: Sidebar + Main Workspace ==================== */
  .app-shell {
    display: flex;
    min-height: 100vh;
  }

  .sidebar {
    width: var(--sidebar-w);
    flex-shrink: 0;
    background:
      radial-gradient(circle at 0% 0%, rgba(192, 166, 141, 0.14), transparent 36%),
      linear-gradient(180deg, #101012 0%, #0a0a0b 100%);
    color: #f5f3ef;
    border-right: 1px solid rgba(192, 166, 141, 0.25);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 24px 16px 18px;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
  }

  .sidebar-brand {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 4px 6px 20px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    margin-bottom: 18px;
  }

  .brand-emblem {
    width: 40px;
    height: 40px;
    border-radius: 9px;
    background: linear-gradient(145deg, rgba(192, 166, 141, 0.22), rgba(192, 166, 141, 0.04));
    border: 1px solid rgba(192, 166, 141, 0.58);
    color: var(--brand);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 17px;
    letter-spacing: 0.06em;
    flex-shrink: 0;
  }

  .sidebar-title {
    margin: 0;
    font-family: var(--font-display);
    font-size: 20px;
    font-weight: 600;
    color: #ffffff;
    letter-spacing: 0.01em;
    line-height: 1.1;
  }

  .sidebar-sub {
    margin-top: 2px;
    font-family: var(--font-mono);
    font-size: 9.5px;
    color: var(--brand);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 500;
  }

  .sidebar-section-label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: #7c7770;
    padding: 0 10px;
    margin: 14px 0 8px;
  }

  .sidebar-nav {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .nav-item {
    width: 100%;
    border: 1px solid transparent;
    background: transparent;
    color: #c8c3bc;
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 500;
    padding: 10px 12px;
    border-radius: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    text-align: left;
  }

  .nav-item-left {
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }

  .nav-item svg {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    opacity: 0.8;
  }

  .nav-item:hover {
    background: rgba(255, 255, 255, 0.06);
    color: #ffffff;
  }

  .nav-item.active {
    background: rgba(192, 166, 141, 0.14);
    border-color: rgba(192, 166, 141, 0.35);
    color: #ffffff;
    font-weight: 600;
  }

  .nav-item.active svg {
    color: var(--brand);
    opacity: 1;
  }

  .nav-pill {
    font-size: 11px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    padding: 2px 8px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.08);
    color: #d6d0c8;
  }

  .nav-item.active .nav-pill {
    background: var(--brand);
    color: #111111;
  }

  .sidebar-footer {
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .sidebar-meta-card {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 11.5px;
    color: #a9a39b;
    display: flex;
    flex-direction: column;
    gap: 4px;
    line-height: 1.4;
  }

  .sidebar-meta-card strong {
    color: #f0ece6;
    font-weight: 600;
  }

  .workspace-main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }

  /* ==================== Top Command Bar ==================== */
  .topbar {
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 30;
  }

  .topbar-inner {
    max-width: 1460px;
    margin: 0 auto;
    padding: 14px 28px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
  }

  .topbar-heading {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .topbar-heading h1 {
    margin: 0;
    font-family: var(--font-display);
    font-size: 28px;
    font-weight: 600;
    line-height: 1.05;
    letter-spacing: -0.015em;
    color: var(--text-primary);
  }

  .topbar-subline {
    font-size: 12.5px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .topbar-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .access-badge {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    border: 1px solid var(--border);
    background: var(--bg-subtle);
    color: var(--text-primary);
  }

  .access-badge::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .access-badge.editor {
    background: var(--brand-soft);
    border-color: var(--brand-border);
    color: var(--brand-deep);
  }

  .access-badge.editor::before {
    background: var(--brand-deep);
  }

  .access-badge.viewer {
    background: #f4f4f5;
    border-color: #d4d4d8;
    color: #52525b;
  }

  .access-badge.viewer::before {
    background: #71717a;
  }

  /* ==================== Botões ==================== */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 8px 14px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    border: 1px solid var(--border-strong);
    background: var(--bg-surface);
    color: var(--text-primary);
    cursor: pointer;
    transition: all 0.15s ease;
    white-space: nowrap;
  }

  .btn:hover:not(:disabled) {
    background: var(--brand-soft);
    border-color: var(--brand);
  }

  .btn:disabled {
    opacity: 0.48;
    cursor: not-allowed;
  }

  .btn-primary {
    background: var(--ink-black);
    border-color: var(--ink-black);
    color: #ffffff;
  }

  .btn-primary:hover:not(:disabled) {
    background: #27272a;
    border-color: #27272a;
  }

  .btn-topbar {
    background: var(--bg-surface);
    border-color: var(--border-strong);
    color: var(--text-primary);
  }

  .btn-topbar:hover:not(:disabled) {
    background: var(--brand-soft);
    border-color: var(--brand);
    color: var(--ink-black);
  }

  #newRecord.btn-topbar {
    background: var(--ink-black);
    border-color: var(--ink-black);
    color: var(--brand);
    font-weight: 700;
    box-shadow: var(--shadow-xs);
  }

  #newRecord.btn-topbar:hover:not(:disabled) {
    background: #222226;
    border-color: #222226;
    color: #dfd0be;
  }

  .btn-warn {
    background: var(--brand-deep);
    border-color: var(--brand-deep);
    color: #ffffff;
  }

  .btn-warn:hover:not(:disabled) {
    background: #66503c;
  }

  .btn-sm {
    padding: 5px 11px;
    font-size: 12px;
  }

  .btn-ghost-dark {
    background: rgba(255, 255, 255, 0.08);
    border-color: rgba(255, 255, 255, 0.22);
    color: #ffffff;
  }

  .btn-ghost-dark:hover:not(:disabled) {
    background: rgba(192, 166, 141, 0.22);
    border-color: var(--brand);
  }

  .btn-link {
    background: transparent;
    border: none;
    color: var(--brand-deep);
    padding: 2px 4px;
    font-weight: 700;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 2px;
    font-family: inherit;
    font-size: inherit;
  }

  /* ==================== Conteúdo Principal ==================== */
  .container {
    max-width: 1460px;
    width: 100%;
    margin: 0 auto;
    padding: 20px 22px 48px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* ==================== Alertas ==================== */
  .alert {
    padding: 12px 16px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  .alert-info { background: var(--brand-soft); color: var(--text-primary); border-color: var(--brand-border); }
  .alert-warn { background: var(--warn-bg); color: var(--warn-text); border-color: var(--warn-border); }
  .alert-danger { background: var(--danger-bg); color: var(--danger-text); border-color: var(--danger-border); }
  .alert-success { background: var(--ok-bg); color: var(--ok-text); border-color: var(--ok-border); }

  /* ==================== Barra de Data e Escopo ==================== */
  .date-toolbar {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 14px 20px;
    box-shadow: var(--shadow-xs);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
  }

  .date-nav {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .date-label-block {
    margin-right: 10px;
    padding-right: 16px;
    border-right: 1px solid var(--border);
  }

  .date-label-caption {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--brand-deep);
    display: block;
  }

  .date-label-value {
    font-size: 16px;
    font-weight: 700;
    color: var(--text-primary);
    letter-spacing: -0.015em;
    font-variant-numeric: tabular-nums;
  }

  .date-input {
    padding: 5px 10px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    font-family: inherit;
    font-size: 12.5px;
    color: var(--text-primary);
    background: var(--bg-subtle);
  }

  .date-input:focus {
    outline: none;
    border-color: var(--brand-deep);
    box-shadow: 0 0 0 3px rgba(192, 166, 141, 0.25);
  }

  .toolbar-right {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .scope-tabs {
    display: inline-flex;
    background: var(--bg-muted);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 3px;
    gap: 3px;
  }

  .scope-tab {
    border: none;
    background: transparent;
    padding: 7px 14px;
    border-radius: 7px;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .scope-tab.active {
    background: var(--ink-black);
    color: #ffffff;
    box-shadow: var(--shadow-xs);
  }

  .scope-tab.active span {
    color: var(--brand);
  }

  /* ==================== KPI Hero Bento Assimétrico ==================== */
  .kpi-grid {
    display: grid;
    grid-template-columns: 1.55fr 1fr 1fr 1fr;
    gap: 14px;
  }

  .kpi-card {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
    box-shadow: var(--shadow-sm);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 10px;
    transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.2s ease, border-color 0.2s ease;
  }

  .kpi-card:hover {
    transform: translateY(-2px);
    border-color: var(--brand-border);
    box-shadow: 0 12px 28px rgba(14, 14, 16, 0.08);
  }

  /* Cartão destaque editorial em Preto Obsidian + Brilho Champagne + Faísca Neon */
  .kpi-card.pending {
    position: relative;
    overflow: hidden;
    isolation: isolate;
    background:
      radial-gradient(circle at 92% 14%, rgba(192, 166, 141, 0.25), transparent 52%),
      linear-gradient(155deg, #161514 0%, #0a0a0b 100%);
    border-color: rgba(192, 166, 141, 0.42);
    color: #ffffff;
    box-shadow: 0 18px 42px -20px rgba(192, 166, 141, 0.35), var(--shadow-sm);
  }

  .kpi-card.pending::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    opacity: 0.08;
    background-image: radial-gradient(#c0a68d 1px, transparent 1.4px);
    background-size: 16px 16px;
  }

  .kpi-card.pending > * {
    position: relative;
    z-index: 1;
  }

  .kpi-card.pending > .heroi-faisca {
    position: absolute;
    z-index: 0;
    top: 10px;
    right: 0;
    width: 66%;
    height: 112px;
    opacity: 0.72;
    pointer-events: none;
    -webkit-mask-image: linear-gradient(to right, transparent, #000 38%);
    mask-image: linear-gradient(to right, transparent, #000 38%);
  }

  .heroi-faisca svg {
    display: block;
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  .kpi-card.pending .kpi-index { color: var(--brand); opacity: 0.9; }
  .kpi-card.pending .kpi-title { color: #f5f0e8; }
  .kpi-card.pending .kpi-value {
    color: #ffffff;
    font-size: 48px;
    text-shadow: 0 0 22px rgba(192, 166, 141, 0.35);
  }
  .kpi-card.pending .kpi-sub { color: #b9b0a6; border-top: 1px solid rgba(192, 166, 141, 0.2); padding-top: 8px; }
  .kpi-card.pending .kpi-icon {
    background: rgba(192, 166, 141, 0.16);
    color: var(--brand);
    border-color: rgba(192, 166, 141, 0.45);
    box-shadow: 0 0 14px rgba(192, 166, 141, 0.22);
  }

  .kpi-index {
    display: block;
    font-family: var(--font-mono);
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--brand-deep);
    margin-bottom: 3px;
  }

  .kpi-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
  }

  .kpi-icon {
    width: 34px;
    height: 34px;
    border-radius: 9px;
    background: var(--brand-soft);
    border: 1px solid var(--brand-border);
    color: var(--brand-deep);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .kpi-card.fatal .kpi-icon {
    background: var(--danger-bg);
    border-color: var(--danger-border);
    color: var(--danger-text);
  }

  .kpi-card.juntada .kpi-icon {
    background: var(--ink-black);
    border-color: var(--ink-black);
    color: var(--brand);
  }

  .kpi-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-primary);
    letter-spacing: -0.01em;
  }

  .kpi-value {
    font-family: var(--font-display);
    font-size: 42px;
    line-height: 0.96;
    font-weight: 600;
    color: var(--text-primary);
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
    margin: 2px 0;
  }

  .kpi-sub {
    font-size: 11.5px;
    color: var(--text-muted);
    line-height: 1.4;
  }

  /* ==================== Seção de Gráficos Analíticos ==================== */
  .analytics-section {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .analytics-row-top {
    display: grid;
    grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr);
    gap: 14px;
  }

  .analytics-row-bottom {
    display: grid;
    grid-template-columns: 1.15fr 1fr 1fr;
    gap: 14px;
  }

  .chart-card {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 22px;
    box-shadow: var(--shadow-sm);
    display: flex;
    flex-direction: column;
    gap: 14px;
    transition: border-color 0.25s ease, box-shadow 0.25s ease;
  }

  .chart-card:hover {
    border-color: var(--brand-border);
  }

  /* Painel Neon Obsidian inspirado em controle-de-gastos (adaptado para Preto + Branco + #c0a68d) */
  .chart-card-dark {
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(circle at 82% 8%, rgba(192, 166, 141, 0.18), transparent 48%),
      linear-gradient(165deg, #151413 0%, #0c0c0d 100%);
    border-color: rgba(192, 166, 141, 0.36);
    color: #f7f4ef;
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.05),
      0 18px 40px -22px rgba(14, 14, 16, 0.65);
  }

  .chart-card-dark::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0.06;
    background-image: radial-gradient(#c0a68d 1px, transparent 1.3px);
    background-size: 18px 18px;
  }

  .chart-card-dark > * {
    position: relative;
    z-index: 1;
  }

  .chart-card-dark:hover {
    border-color: rgba(192, 166, 141, 0.65);
  }

  .chart-card-dark .chart-head {
    border-bottom-color: rgba(255, 255, 255, 0.09);
  }

  .chart-card-dark .chart-title {
    color: #ffffff;
  }

  .chart-card-dark .chart-sub,
  .chart-card-dark .chart-legend-inline {
    color: #aba399;
  }

  .chart-card-dark .chart-switcher {
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(192, 166, 141, 0.25);
  }

  .chart-card-dark .chart-switch-btn {
    color: #cfc8be;
  }

  .chart-card-dark .chart-switch-btn.active {
    background: var(--brand);
    color: #111111;
    box-shadow: 0 0 14px rgba(192, 166, 141, 0.45);
  }

  .chart-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    padding-bottom: 10px;
    border-bottom: 1px solid #f2ede6;
  }

  .chart-title {
    margin: 0;
    font-family: var(--font-display);
    font-size: 21px;
    font-weight: 600;
    line-height: 1.1;
    letter-spacing: -0.01em;
    color: var(--text-primary);
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }

  .chart-title::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--brand);
    box-shadow: 0 0 10px rgba(192, 166, 141, 0.85);
    flex-shrink: 0;
  }

  /* Animações Neon dos Gráficos SVG (inspiradas em controle-de-gastos) */
  @keyframes neonBarGrow {
    from { transform: scaleY(0); opacity: 0.2; }
    to { transform: scaleY(1); opacity: 1; }
  }

  @keyframes neonLineDraw {
    from { stroke-dashoffset: 1; }
    to { stroke-dashoffset: 0; }
  }

  @keyframes neonFadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @keyframes neonHaloPulse {
    0% { transform: scale(0.6); opacity: 0.55; }
    70%, 100% { transform: scale(1.75); opacity: 0; }
  }

  @keyframes neonBarFillX {
    from { transform: scaleX(0); }
    to { transform: scaleX(1); }
  }

  @keyframes neonDonutSweep {
    from { opacity: 0; transform: rotate(-115deg) scale(0.92); }
    to { opacity: 1; transform: rotate(0deg) scale(1); }
  }

  .timeline-bar-anim {
    transform-box: fill-box;
    transform-origin: bottom;
    animation: neonBarGrow 0.65s cubic-bezier(0.2, 0.85, 0.25, 1) var(--bar-delay, 0ms) both;
  }

  .neon-draw {
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
    animation: neonLineDraw 1.15s cubic-bezier(0.35, 0, 0.2, 1) 0.18s forwards;
  }

  .neon-surge {
    animation: neonFadeIn 0.7s ease var(--surge-delay, 0.35s) both;
  }

  .neon-beacon .neon-halo {
    transform-box: fill-box;
    transform-origin: center;
    animation: neonHaloPulse 2.4s ease-out infinite;
  }

  .donut-svg-anim {
    transform-origin: center;
    animation: neonDonutSweep 0.75s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  .chart-sub {
    margin: 2px 0 0;
    font-size: 12px;
    color: var(--text-muted);
  }

  .chart-switcher {
    display: inline-flex;
    background: var(--bg-muted);
    border-radius: 8px;
    padding: 3px;
    gap: 2px;
  }

  .chart-switch-btn {
    border: none;
    background: transparent;
    padding: 4px 10px;
    border-radius: 6px;
    font-family: inherit;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--text-secondary);
    cursor: pointer;
  }

  .chart-switch-btn.active {
    background: var(--ink-black);
    color: #ffffff;
  }

  .chart-badge-pill {
    font-size: 11px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--brand-soft);
    color: var(--brand-deep);
    border: 1px solid var(--brand-border);
    white-space: nowrap;
  }

  /* Timeline SVG Chart */
  .timeline-svg-wrap {
    width: 100%;
    overflow-x: auto;
  }

  .timeline-svg {
    width: 100%;
    min-width: 460px;
    height: 210px;
    display: block;
  }

  .timeline-bar-group {
    cursor: pointer;
  }

  .timeline-bar-group:hover .timeline-bar {
    opacity: 0.85;
  }

  .chart-legend-inline {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    font-size: 11.5px;
    color: var(--text-muted);
  }

  .legend-dot {
    display: inline-block;
    width: 9px;
    height: 9px;
    border-radius: 3px;
    margin-right: 5px;
    vertical-align: middle;
  }

  /* Ranking de Responsáveis */
  .rank-list {
    display: flex;
    flex-direction: column;
    gap: 11px;
  }

  .rank-row {
    border: 1px solid transparent;
    background: transparent;
    width: 100%;
    text-align: left;
    padding: 7px 9px;
    margin: -3px -9px;
    border-radius: 10px;
    cursor: pointer;
    font-family: inherit;
    display: flex;
    flex-direction: column;
    gap: 6px;
    transition: background 0.14s ease, border-color 0.14s ease;
  }

  .rank-row:hover {
    background: var(--bg-subtle);
    border-color: var(--border);
  }

  .rank-row.is-active-filter {
    background: var(--brand-soft);
    border-color: var(--brand);
  }

  .rank-row-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .rank-person {
    display: flex;
    align-items: center;
    gap: 9px;
    min-width: 0;
  }

  .rank-ordinal {
    font-family: var(--font-mono);
    font-size: 10.5px;
    font-weight: 600;
    color: var(--brand-deep);
    width: 18px;
    flex-shrink: 0;
  }

  .avatar-chip {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--bg-muted);
    color: var(--ink-black);
    border: 1px solid var(--border-strong);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.03em;
    flex-shrink: 0;
  }

  .avatar-chip.top-leader {
    background: var(--ink-black);
    color: var(--brand);
    border-color: var(--ink-black);
  }

  .rank-name {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-primary);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .rank-crown {
    font-size: 10px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 999px;
    background: var(--brand);
    color: #111111;
    flex-shrink: 0;
  }

  .rank-counts {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-primary);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .rank-counts small {
    font-weight: 500;
    color: var(--text-muted);
    margin-left: 4px;
  }

  .bar-track {
    width: 100%;
    height: 8px;
    border-radius: 999px;
    background: var(--bg-muted);
    overflow: hidden;
    display: flex;
  }

  .bar-fill-main {
    height: 100%;
    background: linear-gradient(90deg, #3a3734 0%, #0e0e10 100%);
    box-shadow: 0 0 8px rgba(14, 14, 16, 0.25);
    border-radius: 999px;
    transform-origin: left;
    transition: width 0.45s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .bar-fill-brand {
    height: 100%;
    background: linear-gradient(90deg, rgba(192, 166, 141, 0.55) 0%, #c0a68d 65%, #dfc9b2 100%);
    box-shadow: 0 0 12px rgba(192, 166, 141, 0.65);
    border-radius: 999px;
    transform-origin: left;
    transition: width 0.45s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .bar-fill-danger {
    height: 100%;
    background: linear-gradient(90deg, rgba(140, 29, 36, 0.58) 0%, #8c1d24 100%);
    box-shadow: 0 0 10px rgba(140, 29, 36, 0.4);
    border-radius: 999px;
    transform-origin: left;
    transition: width 0.45s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .bar-anim-x {
    animation: neonBarFillX 0.72s cubic-bezier(0.2, 0.85, 0.25, 1) var(--bar-delay, 0ms) both;
  }

  /* Donut de Protocolo */
  .donut-layout {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    flex: 1;
  }

  .donut-wrap {
    position: relative;
    width: 138px;
    height: 138px;
    flex-shrink: 0;
  }

  .donut-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  .donut-pct {
    font-family: var(--font-display);
    font-size: 32px;
    font-weight: 600;
    color: var(--text-primary);
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }

  .donut-pct-label {
    font-size: 8.5px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-top: 3px;
  }

  .donut-legend {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .legend-btn {
    border: 1px solid var(--border);
    background: var(--bg-subtle);
    border-radius: 10px;
    padding: 9px 12px;
    cursor: pointer;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    transition: border-color 0.14s ease, background 0.14s ease;
  }

  .legend-btn:hover,
  .legend-btn.is-active-filter {
    background: var(--brand-soft);
    border-color: var(--brand);
  }

  .legend-btn-left {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-primary);
  }

  .legend-btn-val {
    font-size: 14px;
    font-weight: 700;
    color: var(--text-primary);
    font-variant-numeric: tabular-nums;
  }

  /* Distribuições compactas (Priorização e Tribunais) */
  .mini-bars {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .mini-bar-btn {
    border: 1px solid transparent;
    background: transparent;
    width: 100%;
    padding: 6px 8px;
    margin: -3px -8px;
    border-radius: 9px;
    cursor: pointer;
    font-family: inherit;
    text-align: left;
    display: flex;
    flex-direction: column;
    gap: 5px;
    transition: background 0.12s ease, border-color 0.12s ease;
  }

  .mini-bar-btn:hover {
    background: var(--bg-subtle);
    border-color: var(--border);
  }

  .mini-bar-btn.is-active-filter {
    background: var(--brand-soft);
    border-color: var(--brand);
  }

  .mini-bar-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-primary);
  }

  .mini-bar-top span:last-child {
    font-variant-numeric: tabular-nums;
    color: var(--text-secondary);
  }

  /* ==================== Busca e Filtros ==================== */
  .control-card {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 18px 20px;
    box-shadow: var(--shadow-sm);
  }

  .docket-section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }

  .docket-section-title {
    margin: 0;
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--text-primary);
  }

  .filters-top-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px;
    align-items: end;
    margin-bottom: 12px;
  }

  .search-input-wrap {
    position: relative;
  }

  .search-input-wrap svg {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    width: 15px;
    height: 15px;
    color: var(--text-muted);
    pointer-events: none;
  }

  .search-input-wrap input {
    padding-left: 36px !important;
  }

  .filters-grid {
    display: grid;
    grid-template-columns: repeat(5, minmax(130px, 1fr));
    gap: 10px;
    align-items: end;
  }

  .field-group label {
    display: block;
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    margin-bottom: 5px;
  }

  .field-group input,
  .field-group select,
  .field-group textarea {
    width: 100%;
    padding: 8px 11px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    font-family: inherit;
    font-size: 13px;
    color: var(--text-primary);
    background: var(--bg-subtle);
    transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
  }

  .field-group input:focus,
  .field-group select:focus,
  .field-group textarea:focus {
    outline: none;
    background: #ffffff;
    border-color: var(--brand-deep);
    box-shadow: 0 0 0 3px rgba(192, 166, 141, 0.25);
  }

  .field-group input:disabled,
  .field-group select:disabled,
  .field-group textarea:disabled {
    background: var(--bg-muted);
    color: var(--text-muted);
    cursor: not-allowed;
  }

  .filters-footer {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    font-size: 12px;
    color: var(--text-muted);
  }

  /* ==================== Lista Executiva (Sem cara de Excel) ==================== */
  .table-card {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
  }

  .table-scroll {
    overflow-x: auto;
  }

  table.agenda-table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
    min-width: 980px;
  }

  table.agenda-table thead th {
    background: var(--bg-subtle);
    color: var(--text-muted);
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    text-align: left;
    padding: 12px 7px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }

  table.agenda-table thead th:nth-child(1) { width: 10.4%; }
  table.agenda-table thead th:nth-child(2) { width: 7.4%; }
  table.agenda-table thead th:nth-child(3) { width: 7.4%; }
  table.agenda-table thead th:nth-child(4) { width: 15.2%; }
  table.agenda-table thead th:nth-child(5) { width: 11.4%; }
  table.agenda-table thead th:nth-child(6) { width: 10.6%; }
  table.agenda-table thead th:nth-child(7) { width: 7.6%; }
  table.agenda-table thead th:nth-child(8) { width: 12.6%; }
  table.agenda-table thead th:nth-child(9) { width: 8.2%; }
  table.agenda-table thead th:nth-child(10) { width: 9.2%; }

  table.agenda-table tbody tr {
    border-bottom: 1px solid #f0ebe3;
    cursor: pointer;
    transition: background 0.16s ease, box-shadow 0.16s ease;
  }

  table.agenda-table tbody tr:last-child {
    border-bottom: none;
  }

  table.agenda-table tbody tr:hover {
    background: #f8f3ec;
  }

  /* Destaque de fundo por grau de priorização (mais intenso para casos urgentes) */
  table.agenda-table tbody tr.row-pending {
    background: #fcf9f3;
  }

  table.agenda-table tbody tr.row-pending td:first-child {
    box-shadow: inset 3px 0 0 var(--brand);
  }

  table.agenda-table tbody tr.row-prio-urgente {
    background: linear-gradient(90deg, rgba(140, 29, 36, 0.12) 0%, rgba(140, 29, 36, 0.045) 55%, rgba(140, 29, 36, 0.02) 100%);
  }

  table.agenda-table tbody tr.row-prio-urgente td:first-child {
    box-shadow: inset 4px 0 0 #8c1d24;
  }

  table.agenda-table tbody tr.row-prio-urgente:hover {
    background: linear-gradient(90deg, rgba(140, 29, 36, 0.17) 0%, rgba(140, 29, 36, 0.075) 100%);
